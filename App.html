<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aura Key">
<meta name="theme-color" content="#0E1A22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1A22; --ink2:#33474F; --mute:#5A6B74;
  --paper:#E9EDEE; --card:#FFF; --line:#D3DADD; --line2:#EAEEEF;
  --blue:#1F4E6B; --blue-soft:#E4EDF2;
  --pine:#0F6349; --ochre:#9A6104; --slate:#54646C; --rust:#8C3019;
  --rust-soft:#F6E3DE;
  --f-disp:'Archivo','Helvetica Neue',Arial,sans-serif;
  --f-body:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:clip}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit;font-size:16px}
a{color:var(--blue)}
.phone{max-width:480px;margin:0 auto;background:var(--paper);min-height:100vh}
@media(min-width:900px){.phone{margin:20px auto;min-height:auto;border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}.tabbar{display:none}.wrap{padding-bottom:40px}}
.topbar{background:var(--ink);color:#fff;position:sticky;top:0;z-index:20;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top))}
.hdr{background:var(--ink);color:#fff;padding:0 14px 16px}
.hdr-row{display:flex;align-items:center;gap:11px}
.burger{background:none;border:0;padding:15px 12px;margin:-8px 0;display:grid;gap:4px;cursor:pointer}
.burger span{width:20px;height:2px;background:#fff;display:block;border-radius:2px}
.mark{width:28px;height:28px;border-radius:4px;background:var(--blue);display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:12px;color:#fff}
.hdr-name{font-family:var(--f-disp);font-weight:800;font-size:14px}
.hdr-crumb{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;color:#8CA5B0;text-transform:uppercase;margin-top:1px}
.hdr h1{font-family:var(--f-disp);font-weight:600;font-size:20px;margin:4px 0 0;letter-spacing:-.02em}
.hdr p{margin:3px 0 0;font-size:12px;color:#9DB2BB}
.scrim{position:fixed;inset:0;background:rgba(6,14,18,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:82%;max-width:330px;background:var(--card);transform:translateX(-102%);transition:transform .22s;z-index:31;overflow-y:auto;overscroll-behavior:contain;box-shadow:2px 0 18px rgba(0,0,0,.18)}
.drawer.on{transform:translateX(0)}
.dr-head{background:var(--ink);color:#fff;padding:16px 16px 15px;display:flex;align-items:center;gap:10px}
.dr-grp{font-family:var(--f-mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute);padding:16px 18px 6px}
.dr-item{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;text-align:left;padding:13px 18px;font-size:15px;color:var(--ink);border-left:3px solid transparent}
.dr-item:active{background:var(--blue-soft)}
.dr-item.on{background:var(--blue-soft);border-left-color:var(--blue);color:var(--blue);font-weight:600}
.dr-item.sub{padding-left:40px;font-size:14px;color:var(--ink2)}
.dr-ic{width:18px;height:18px;flex:none;color:var(--mute)}
.dr-item.on .dr-ic{color:var(--blue)}
.wrap{padding:16px 14px calc(78px + env(safe-area-inset-bottom))}
.loading{color:var(--mute);font-size:13px;padding:24px 4px}
.err{color:var(--rust);font-size:13px;padding:14px 4px}
.empty{color:var(--mute);font-size:13px;padding:20px 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin-bottom:11px}
.card-t{font-family:var(--f-disp);font-weight:600;font-size:15.5px;color:var(--ink);margin:0 0 3px}
.card-s{font-size:13.5px;color:var(--mute)}
.kv{display:flex;gap:8px;font-size:13.5px;padding:4px 0}
.kk{color:var(--mute);flex:none;min-width:80px;font-size:13px}
.vv{color:var(--ink2);min-width:0;word-break:break-word}
.pill{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:3px 8px;border-radius:20px;background:var(--blue-soft);color:var(--blue);margin-bottom:6px}
.pill.focus{background:#F7EEDC;color:var(--ochre)}
.lnkrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.lnk{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:8px;padding:11px 14px;font-size:13px;font-weight:600;color:var(--blue);background:#fff;text-decoration:none;min-height:44px}
.lnk:active{background:var(--blue-soft)}
.sec-h{font-family:var(--f-disp);font-weight:600;font-size:13px;color:var(--ink);margin:18px 2px 9px;text-transform:uppercase;letter-spacing:.04em;scroll-margin-top:64px}
.sec-h:first-child{margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.citychip{border:1px solid var(--line);background:#fff;border-radius:22px;padding:12px 16px;font-size:13px;font-weight:600;color:var(--ink);min-height:44px}
.citychip:active{border-color:var(--blue);color:var(--blue)}
.fbar{display:flex;gap:8px;margin-bottom:14px}
.fbar input{flex:1;padding:12px 13px;border:1px solid var(--line);border-radius:8px;background:#fff}
.fbar input:focus{outline:2px solid var(--blue);outline-offset:-1px}
.gobtn{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:0 16px;font-weight:600;font-size:14px}
.seg{display:flex;gap:6px;margin-bottom:14px}
.seg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:12px 9px;font-size:13px;font-weight:600;color:var(--ink2);min-height:44px}
.seg button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.stamp{display:inline-block;border:2px solid currentColor;border-radius:3px;padding:7px 13px 6px;box-shadow:inset 0 0 0 1px currentColor;margin-bottom:2px}
.stamp b{display:block;font-family:var(--f-disp);font-weight:800;font-size:15px;letter-spacing:.09em;text-transform:uppercase;line-height:1}
.c-pine{color:var(--pine)} .c-ochre{color:var(--ochre)} .c-grey{color:var(--slate)} .c-blue{color:var(--blue)} .c-rust{color:var(--rust)}
.say{background:#FBFAF8;border:1px solid var(--line);border-left:3px solid var(--ink);border-radius:8px;padding:13px 14px;font-size:14.5px;line-height:1.6;color:var(--ink);margin-top:8px}
.say em{font-style:italic;color:var(--blue)}
.copy{margin-top:9px;display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;border:0;border-radius:8px;padding:10px 15px;font-size:12.5px;font-weight:600}
.next{margin:8px 0 0;padding:0;list-style:none}
.next li{position:relative;padding:7px 0 7px 18px;font-size:13.5px;color:var(--ink2);border-bottom:1px solid var(--line2)}
.next li:last-child{border-bottom:0}
.next li:before{content:"";position:absolute;left:2px;top:14px;width:6px;height:6px;border-radius:50%;background:var(--blue)}
.seclbl{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:20px 0 8px}
.ev{margin-top:16px;border-top:1px solid var(--line)}
.ev summary{cursor:pointer;list-style:none;padding:12px 2px 5px;font-size:12.5px;font-weight:600;color:var(--mute)}
.ev summary::-webkit-details-marker{display:none}
.warn{margin-top:14px;background:var(--rust-soft);border:1px solid #e6c6bd;border-radius:8px;padding:11px 13px;font-size:12px;color:var(--rust);line-height:1.5}
.install{margin:0 0 14px;background:var(--blue-soft);border:1px solid #cfe0ea;border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--blue);position:relative}
.install .x{position:absolute;top:6px;right:9px;border:0;background:none;color:var(--blue);font-size:16px}
.login-card{max-width:340px;margin:8px auto}
.login-card input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--line);flex:none}
.linklike{background:none;border:0;color:var(--blue);font:inherit;font-weight:600;padding:0;text-decoration:underline;cursor:pointer}
.tabbar{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:25;padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 9px;font-size:10.5px;font-weight:600;color:var(--mute);min-height:52px;cursor:pointer}
.tabbar button.on{color:var(--blue)}
.tabbar svg{width:22px;height:22px}
.toTop{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));right:max(14px,calc(50vw - 226px));width:46px;height:46px;border-radius:50%;border:0;background:var(--ink);color:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(6,14,18,.28);z-index:24;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .18s,transform .18s;cursor:pointer}
.toTop.show{opacity:1;pointer-events:auto;transform:none}
@media(min-width:900px){.toTop{bottom:20px}}
@media(prefers-reduced-motion:reduce){.toTop{transition:none}}
.skel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 15px;margin-bottom:11px}
.skel .b{height:12px;border-radius:6px;background:var(--line2);position:relative;overflow:hidden}
.skel .b::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shimmer 1.2s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
@media(prefers-reduced-motion:reduce){.skel .b::after{animation:none}}
</style>
</head>
<body>
<div class="phone">
  <div class="topbar">
    <div class="hdr-row">
      <button class="burger" onclick="openDrawer()" aria-label="Menu"><span></span><span></span><span></span></button>
      <div class="mark">AK</div>
      <div>
        <div class="hdr-name">Aura Key Realty</div>
        <div class="hdr-crumb" id="crumb">Realtor Tools</div>
      </div>
    </div>
  </div>
  <div class="hdr">
    <h1 id="scr-title">Home</h1>
    <p id="scr-sub"></p>
  </div>
  <div class="wrap"><div id="content"></div></div>
  <nav class="tabbar" id="tabbar" aria-label="Quick navigation"></nav>
  <button class="toTop" id="toTop" aria-label="Back to top"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
</div>
<div class="scrim" id="scrim" onclick="closeDrawer()"></div>
<nav class="drawer" id="drawer">
  <div class="dr-head"><div class="mark">AK</div><div><div class="hdr-name">Aura Key Realty</div><div class="hdr-crumb">Realtor Tools</div></div></div>
  <div id="navlist"></div>
  <div style="padding:16px 18px 30px;color:var(--mute);font-size:11px;font-family:var(--f-mono)">v1 · Team app</div>
</nav>

<script>
var NAV=[
  {g:'Daily'},
  {v:'home',       t:'Home',            ic:'M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'},
  {v:'cities',     t:'Cities',          ic:'M3 21h18M6 21V7l6-4 6 4v14'},
  {g:'Directory'},
  {v:'listings',   t:'Active Listings', ic:'M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01'},
  {v:'builders',   t:'Builders',        ic:'M2 20h20M4 20V10l8-6 8 6v10'},
  {v:'contractors',t:'Concierge',       ic:'M12 2a5 5 0 0 1 5 5c0 3-5 9-5 9S7 10 7 7a5 5 0 0 1 5-5z'},
  {g:'Research'},
  {v:'schools',    t:'School Rankings', ic:'M22 10L12 5 2 10l10 5 10-5zM6 12v5c0 1 3 3 6 3s6-2 6-3v-5'},
  {v:'findschool', t:'Find My School',  ic:'M12 21s-7-5.2-7-11a7 7 0 0 1 14 0c0 5.8-7 11-7 11z', sub:1},
  {v:'crime',      t:'Crime Records',   ic:'M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6z'},
  {v:'tenants',    t:'LTB',             ic:'M4 4h16v16H4zM8 9h8M8 13h8M8 17h5'},
  {v:'basement',   t:'Basement Check',  ic:'M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'},
  {v:'expenses',   t:'Home Expenses',   ic:'M4 4h16v16H4zM8 8h8M8 12h4'},
  {g:'Team'},
  {v:'buyerguide', t:'Buyers Guide',    ic:'M4 5h16v14H4zM4 9h16'},
  {v:'callnight',  t:'Call Night',      ic:'M4 4h4l2 5-3 2a12 12 0 0 0 6 6l2-3 5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 2 6a2 2 0 0 1 2-2z'},
  {v:'leaderboard',t:'Leaderboard',     ic:'M6 21V10M12 21V4M18 21v-7'},
  {v:'resources',  t:'Resources',       ic:'M4 5h16v14H4zM4 9h16M9 5v14'},
  {v:'mydeals',    t:'My Deals',        ic:'M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6'},
  {v:'onboarding', t:'Bootcamp',        ic:'M12 2l3 6 6 .9-4.5 4.3 1 6.3L12 16.8 6.5 19.5l1-6.3L3 8.9 9 8z'},
  {v:'vacations',  t:'Vacation Tracker',ic:'M2 22l20-8-8-8-4 4-8 4zM11 10l3 3'},
  {v:'websites',   t:'Websites',        ic:'M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20'},
  {v:'faqs',       t:'FAQs',            ic:'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.8.4-1 .8-1 1.7M12 17h.01'}
];
var SUB={home:'Your team hub, contacts and events.',cities:'Projects and builders by city.',listings:'Current active listings.',builders:'Builder reps and projects.',contractors:'Trusted concierge contacts.',schools:'Rankings by school.',findschool:'Find the school for an address.',crime:'Crime records by city.',tenants:'Search LTB orders.',basement:"Check a city's registration record.",expenses:'Estimate monthly carrying costs.',buyerguide:'Present the buyer guide.',callnight:'Call-night attendance.',leaderboard:'Team call leaderboard.',resources:'Guides and tools.',mydeals:'Your deals and follow-ups.',onboarding:'The onboarding bootcamp.',vacations:'Who is away and when.',websites:'Handy website links.',faqs:'Common questions.'};

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function $(id){return document.getElementById(id);}
function call(action,params){return new Promise(function(res,rej){google.script.run.withSuccessHandler(res).withFailureHandler(rej).app(action,params||{});});}
/* read-through cache: instant back-navigation, offline fallback, manual refresh */
var MEM={}, FRESH=false, RENDER_FRESH=false, CACHE_TTL=600000;
function ckey(a,p){ return a+':'+JSON.stringify(p||{}); }
function cachedCall(action,params){
  var k=ckey(action,params), fresh=RENDER_FRESH;
  if(!fresh){
    var m=MEM[k];
    if(m && Date.now()-m.at<CACHE_TTL) return Promise.resolve(m.data);
  }
  var p=params||{};
  if(fresh){ p={}; for(var kk in params) p[kk]=params[kk]; p.fresh=1; }
  return call(action,p).then(function(d){
    MEM[k]={data:d,at:Date.now()};
    try{ var sj=JSON.stringify({data:d,at:Date.now()}); if(sj.length<200000) localStorage.setItem('akc_'+k,sj); }catch(e){}
    return d;
  }).catch(function(err){
    var m2=MEM[k]; if(m2){ m2.data.__offline=m2.at; return m2.data; }
    try{ var raw=localStorage.getItem('akc_'+k); if(raw){ var o=JSON.parse(raw); o.data.__offline=o.at; return o.data; } }catch(e2){}
    throw err;
  });
}
function refreshView(){ FRESH=true; route(); }
function ago(t){ var ms=Date.now()-(typeof t==='number'?t:new Date(t).getTime()); if(isNaN(ms)||ms<0||ms>2592000000) return ''; var m=Math.round(ms/60000); if(m<1) return 'just now'; if(m<60) return m+'m ago'; var h=Math.round(m/60); return h<24?h+'h ago':Math.round(h/24)+'d ago'; }
var STALE_MS=600000;   // under 10 min the data counts as fresh — no Refresh button
function stamp(d){
  if(!d) return '';
  var off=d.__offline?'<div class="warn" style="margin:0 0 12px">Offline — showing saved data from '+esc(ago(d.__offline)||'earlier')+'.</div>':'';
  if(!d.updated) return off;
  var ms=Date.now()-new Date(d.updated).getTime(), bogus=isNaN(ms)||ms<0||ms>2592000000;
  var a=bogus?'':ago(d.updated);
  var showBtn=bogus||ms>=STALE_MS;
  var up='<div class="card-s" style="margin:0 2px 12px">'+(a?'Updated '+esc(a):'')
    +(showBtn?((a?' · ':'')+'<button class="linklike" onclick="refreshView()">Refresh</button>'):'')+'</div>';
  return off+up;
}
function isUrl(v){return /^https?:\/\//i.test(String(v||''));}
function host(u){try{return String(u).replace(/^https?:\/\//,'').replace(/^www\./,'').split('/')[0];}catch(e){return u;}}
/* website-parity helpers */
function money(v){ var s=String(v==null?'':v).trim(); if(!s) return ''; var n=s.replace(/[^0-9.]/g,''); if(!n) return s; var f=parseFloat(n); return isNaN(f)?s:'$'+f.toLocaleString('en-US',{maximumFractionDigits:0}); }
function pick(o,names){ if(!o) return ''; for(var i=0;i<names.length;i++){ for(var k in o){ if(k.toLowerCase()===names[i].toLowerCase() && o[k]!=null && o[k]!=='') return o[k]; } } return ''; }
function scoreNum(s){ var f=parseFloat(s); return isNaN(f)?-1:f; }
function scoreColor(s){ var f=scoreNum(s); if(f>=7.6)return['#8CC63F','#123']; if(f>=6)return['#EBCB3E','#3a2f00']; if(f>=4.1)return['#EF8B33','#fff']; if(f>=0)return['#E24B4B','#fff']; return['#e5e7eb','#6A7C84']; }
function scoreBand(f){ if(f>=7.6)return'High'; if(f>=6)return'Good'; if(f>=4.1)return'Fair'; if(f>=0)return'Low'; return''; }
function scoreBadge(s){ var c=scoreColor(s),bd=scoreBand(scoreNum(s)); return '<span style="display:inline-flex;align-items:center;gap:6px"><b style="background:'+c[0]+';color:'+c[1]+';font-family:var(--f-mono);font-size:13px;font-weight:700;padding:3px 8px;border-radius:6px">'+esc(s||'—')+'</b>'+(bd?'<span style="font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em">'+bd+'</span>':'')+'</span>'; }
function listTone(l){ if(l.exclusive) return ['#F7EEDC','#9A6104']; var s=((l.status||'')+' '+(l.section||'')).toLowerCase(); if(s.indexOf('lease')>=0)return['#eef0f3','#54646C']; if(s.indexOf('commercial')>=0)return['#E4EDF2','#1F4E6B']; if(s.indexOf('sold')>=0)return['#F6E3DE','#8C3019']; return['#E1EFE9','#0F6349']; }
function initials(n){ n=String(n||'').trim(); if(!n)return'?'; var p=n.split(/\s+/); return (p[0][0]+(p[1]?p[1][0]:'')).toUpperCase(); }

var TABS=[{v:'home',t:'Home'},{v:'cities',t:'Cities'},{v:'mydeals',t:'My Deals'},{v:'resources',t:'Resources'}];
function buildTabs(){
  $('tabbar').innerHTML=TABS.map(function(t){
    var n=NAV.filter(function(x){return x.v===t.v;})[0]||{};
    return '<button data-v="'+t.v+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="'+n.ic+'"/></svg><span>'+esc(t.t)+'</span></button>';
  }).join('')
  +'<button id="tabMore"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg><span>More</span></button>';
  $('tabbar').querySelectorAll('button[data-v]').forEach(function(b){ b.addEventListener('click',function(){ go(b.dataset.v); }); });
  document.getElementById('tabMore').addEventListener('click',openDrawer);
}
function skel(n){
  var one='<div class="skel"><div class="b" style="width:55%"></div><div class="b" style="width:82%;margin-top:10px"></div><div class="b" style="width:34%;margin-top:10px"></div></div>', h='';
  for(var i=0;i<(n||3);i++) h+=one; return h;
}
function buildNav(){
  $('navlist').innerHTML=NAV.map(function(n){

function go(v,arg){
  closeDrawer();
  var h='#'+v+(arg!=null?'/'+encodeURIComponent(arg):'');
  if(location.hash===h){ route(); } else { try{ location.hash=h; }catch(e){ route(); } }
}
function route(){
  closeDrawer();
  RENDER_FRESH=FRESH; FRESH=false;
  var h=(location.hash||'').replace(/^#/,''), parts=h.split('/');
  var v=parts[0]||'home', arg=parts.length>1?decodeURIComponent(parts.slice(1).join('/')):null;
  if(!LOAD[v]){ v='home'; arg=null; }
  var item=NAV.filter(function(n){return n.v===v;})[0];
  $('scr-title').textContent=item?item.t:(arg||v); $('scr-sub').textContent=item?(SUB[v]||''):'';
  var navKey=(v==='city')?'cities':v;
  $('navlist').querySelectorAll('.dr-item').forEach(function(b){ b.classList.toggle('on', b.dataset.v===navKey); });
  $('tabbar').querySelectorAll('button[data-v]').forEach(function(b){ b.classList.toggle('on', b.dataset.v===navKey); });
  $('content').innerHTML=skel(4);
  window.scrollTo(0,0);
  (LOAD[v]||function(){$('content').innerHTML='<div class="empty">Coming soon.</div>';})(arg);
}

function linkBtn(label,url){ return url?'<a class="lnk" href="'+esc(url)+'" target="_blank">'+esc(label)+'</a>':''; }
function telBtn(p){ p=String(p||'').trim(); return p?'<a class="lnk" href="tel:'+esc(p.replace(/[^0-9+]/g,''))+'">Call '+esc(p)+'</a>':''; }

var CITY_DATA=[], CITY_FOCUS={}, cityFocusOnly=false, cityQ='';
function loadCities(){
  Promise.all([cachedCall('citycounts'),cachedCall('focus')]).then(function(r){
    var cc=r[0]||{}, fo=r[1]||{};
    CITY_DATA=(cc.cities||[]).map(function(c){ return (typeof c==='string')?{city:c,count:0}:{city:c.city||c.name||c.tab, count:c.count||c.projects||0}; });
    CITY_FOCUS={}; ((fo.rows)||[]).forEach(function(p){ var c=(p.city||'').toUpperCase(); if(c) CITY_FOCUS[c]=(CITY_FOCUS[c]||0)+1; });
    $('content').innerHTML=stamp(cc)+'<div class="fbar"><input id="citySearch" placeholder="Search a city…" value="'+esc(cityQ)+'"></div>'
      +'<div class="seg"><button id="cAll" class="'+(cityFocusOnly?'':'on')+'">All</button><button id="cFocus" class="'+(cityFocusOnly?'on':'')+'">★ Focus only</button></div>'
      +'<div class="card-s" id="cityCount" style="margin:0 2px 12px"></div>'
      +'<div id="cityGrid"></div>';
    $('citySearch').addEventListener('input',function(){cityQ=this.value;renderCities();});
    $('cAll').addEventListener('click',function(){cityFocusOnly=false;$('cAll').classList.add('on');$('cFocus').classList.remove('on');renderCities();});
    $('cFocus').addEventListener('click',function(){cityFocusOnly=true;$('cFocus').classList.add('on');$('cAll').classList.remove('on');renderCities();});
    renderCities();
  }).catch(fail);
}
function focusCount(city){ return CITY_FOCUS[(city||'').toUpperCase()]||0; }
function renderCities(){
  var q=cityQ.trim().toLowerCase();
  var rows=CITY_DATA.filter(function(c){
    if(cityFocusOnly && focusCount(c.city)<=0) return false;
    if(q && c.city.toLowerCase().indexOf(q)<0) return false;
    return true;
  }).sort(function(a,b){return a.city.toLowerCase()<b.city.toLowerCase()?-1:1;});
  var tot=0; rows.forEach(function(c){tot+=(c.count||0);});
  $('cityCount').textContent=rows.length+(rows.length===1?' city':' cities')+' · '+tot+(tot===1?' project':' projects');
  $('cityGrid').innerHTML=rows.length?'<div class="chips">'+rows.map(function(c){
    var f=focusCount(c.city);
    var tag=f?'<span style="color:var(--ochre);font-weight:700">★ '+f+'</span>':'<span style="color:var(--mute)">'+(c.count||0)+'</span>';
    return '<button class="citychip" data-c="'+esc(c.city)+'" style="display:flex;gap:8px;align-items:center">'+esc(c.city)+' '+tag+'</button>';
  }).join('')+'</div>':'<div class="empty">No cities match'+(q?' “'+esc(q)+'”':'')+'.</div>';
  $('cityGrid').querySelectorAll('.citychip').forEach(function(b){ b.addEventListener('click',function(){ go('city', b.dataset.c); }); });
}
function backBtn(view,label){ return '<button class="lnk" onclick="go(\''+view+'\')" style="margin-bottom:12px">← '+esc(label)+'</button>'; }

var AL_DATA=[], alSection='all', alQ='';
function loadListings(){
  cachedCall('listings').then(function(d){
    AL_DATA=(d&&d.rows)||[];
    if(!AL_DATA.length){ $('content').innerHTML='<div class="empty">No active listings.</div>'; return; }
    $('content').innerHTML=stamp(d)+'<div class="fbar"><input id="alq" placeholder="Search listings…" value="'+esc(alQ)+'"></div><div class="chips" id="alPills" style="margin-bottom:12px"></div><div class="card-s" id="alCount" style="margin:0 2px 12px"></div><div id="alOut"></div>';
    $('alq').addEventListener('input',function(){alQ=this.value;renderAL();});
    renderAL();
  }).catch(fail);
}
function alSectionOf(l){ return l.exclusive?'For Sale':(l.section||'Other'); }
function alSold(l){ return /sold|leased/i.test(l.status||''); }
function renderAL(){
  var q=alQ.trim().toLowerCase();
  var secs=[],seen={},anySold=false; AL_DATA.forEach(function(l){ if(alSold(l)){anySold=true;return;} var k=alSectionOf(l); if(!seen[k]){seen[k]=1;secs.push(k);} });
  if(anySold) secs.push('Sold/Leased');
  var rows=AL_DATA.filter(function(l){
    if(alSection==='Sold/Leased'){ if(!alSold(l)) return false; }
    else { if(alSold(l)) return false; if(alSection!=='all'&&alSectionOf(l)!==alSection)return false; }
    if(!q)return true; return (l.property+' '+(l.status||'')+' '+(l.section||'')).toLowerCase().indexOf(q)>=0; });
  rows.sort(function(a,b){return (b.exclusive?1:0)-(a.exclusive?1:0);});
  $('alCount').textContent=rows.length+(rows.length===1?' listing':' listings');
  $('alPills').innerHTML=['all'].concat(secs).map(function(s){ return '<button class="citychip'+(alSection===s?' on':'')+'" style="padding:6px 12px" data-s="'+esc(s)+'">'+esc(s==='all'?'All':s)+'</button>'; }).join('');
  $('alPills').querySelectorAll('.citychip').forEach(function(b){ b.addEventListener('click',function(){ alSection=b.dataset.s; renderAL(); }); });
  $('alOut').innerHTML=rows.length?rows.map(function(l){
    var tone=listTone(l), label=l.exclusive?'Exclusive':(l.status||l.section||'Listing');
    return '<div class="card"><span class="pill" style="background:'+tone[0]+';color:'+tone[1]+'">'+esc(label)+'</span>'+(l.section&&!l.exclusive?' <span class="pill">'+esc(l.section)+'</span>':'')
      +'<div class="card-t">'+esc(l.property||'Listing')+'</div>'+(l.price?'<div style="font-family:var(--f-disp);font-weight:600;color:var(--blue);font-size:15px;margin:2px 0">'+esc(money(l.price))+'</div>':'')
      +kv('MLS',l.mls)+kv('Agents',l.agents)+kv('Showing',l.showing)+kv('Notice',l.notice)+'<div class="lnkrow">'+linkBtn('Open listing',l.link)+'</div></div>';
  }).join(''):'<div class="empty">No listings match that.</div>';
}

var schoolQ='';
function loadSchools(){
  cachedCall('schools').then(function(d){
    var rows=(d&&d.rows)||[];
    if(!rows.length){ $('content').innerHTML='<div class="empty">No rankings.</div>'; return; }
    var norm=rows.map(function(r){ return { school:pick(r,['school','name']), level:pick(r,['level','panel']), board:pick(r,['board']), city:pick(r,['city','municipality']), community:pick(r,['community','area']), score:pick(r,['score','rating']), rank:pick(r,['rank','ranking']) }; });
    norm.sort(function(a,b){ return scoreNum(b.score)-scoreNum(a.score); });
    $('content').innerHTML=stamp(d)+'<div class="fbar"><input id="sq" placeholder="Filter by school, city or board…" value="'+esc(schoolQ)+'"></div><div class="card-s" id="sCount" style="margin:0 2px 12px"></div><div id="slist"></div>';
    var LIMIT=200;
    function cardHtml(s){
      var sub=[s.level,s.board,s.city,s.community].filter(Boolean).join(' · ');
      return '<div class="card" style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><div style="min-width:0"><div class="card-t">'+esc(s.school)+'</div>'+(sub?'<div class="card-s">'+esc(sub)+'</div>':'')+'</div><div style="text-align:right;flex:none">'+scoreBadge(s.score)+(s.rank?'<div style="font-size:11px;color:var(--mute);margin-top:4px">Rank '+esc(s.rank)+'</div>':'')+'</div></div>';
    }
    function counts(f,shownLen){ $('sCount').textContent=f.length>shownLen?('Showing top '+shownLen+' of '+f.length+' schools — search to narrow'):(f.length+(f.length===1?' school':' schools')); }
    function moreBtn(){ return '<button class="gobtn" style="width:100%;padding:13px" id="sMore">Show 200 more</button>'; }
    function wireMore(f){ var mb=$('sMore'); if(mb) mb.addEventListener('click',function(){ showMore(f); }); }
    function draw(q){ q=(q||'').toLowerCase();
      var f=norm.filter(function(s){ return !q||(s.school+' '+s.city+' '+s.board+' '+s.community).toLowerCase().indexOf(q)>=0; });
      var shown=f.slice(0,LIMIT);
      counts(f,shown.length);
      $('slist').innerHTML=(shown.map(cardHtml).join('')||'<div class="empty">No match.</div>')+(f.length>shown.length?moreBtn():'');
      wireMore(f);
    }
    function showMore(f){
      var mb=$('sMore'); if(mb) mb.remove();
      var start=LIMIT; LIMIT+=200;
      $('slist').insertAdjacentHTML('beforeend', f.slice(start,LIMIT).map(cardHtml).join('')+(f.length>LIMIT?moreBtn():''));
      counts(f,Math.min(LIMIT,f.length));
      wireMore(f);
    }
    var st; $('sq').addEventListener('input',function(){ var v=this.value; clearTimeout(st); st=setTimeout(function(){ schoolQ=v; LIMIT=200; draw(schoolQ); },200); }); draw(schoolQ);
  }).catch(fail);
}
function fieldLabel(k){ return String(k).replace(/[_-]+/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2').replace(/\s+/g,' ').trim().replace(/^./,function(c){return c.toUpperCase();}); }
function genCard(o){
  if(o==null) return ''; if(typeof o!=='object') return '<div class="card"><div class="vv">'+esc(o)+'</div></div>';
  var keys=Object.keys(o).filter(function(k){return o[k]!=null&&o[k]!==''&&!/^_/.test(k);}); if(!keys.length) return '';
  var title=o.name||o.school||o.title||o.label||o[keys[0]];
  var body=keys.filter(function(k){return o[k]!==title;}).map(function(k){return kv(fieldLabel(k),o[k]);}).join('');
  return '<div class="card"><div class="card-t">'+esc(title)+'</div>'+body+'</div>';
}

function fsSuggest(v){

    $('fsSug').querySelectorAll('[data-i]').forEach(function(el){ el.addEventListener('click',function(){ var a=fsSug[+el.dataset.i]; $('fsAddr').value=a.label; $('fsSug').style.display='none'; if(a.id) fsById(a.id,a.label); else fsGo(); }); });
  }).catch(function(){ $('fsSug').style.display='none'; });

function fsGo(){
  if(!fsSel){ $('fsHint').textContent='Pick a board first.'; return; }

  $('fsSug').style.display='none'; $('fsHint').textContent='Finding schools…'; $('fsOut').innerHTML='';
  call('fslookup',{board:fsSel,addr:addr}).then(fsPaint).catch(function(){ $('fsHint').textContent='Lookup failed — try again.'; });

function fsById(id,label){
  $('fsHint').textContent='Finding schools…'; $('fsOut').innerHTML='';
  call('fsschools',{board:fsSel,id:id,label:label}).then(fsPaint).catch(function(){ $('fsHint').textContent='Lookup failed — try again.'; });
}
function fsPaint(res){
  if(!res||!res.ok){ $('fsHint').textContent=(res&&res.error)||'No schools found for that address.'; return; }
  $('fsHint').innerHTML='';
  var arr=res.schools||[];
  if(res.linkOnly&&res.link){ $('fsOut').innerHTML='<div class="card"><div class="card-s">This board doesn\u2019t expose a lookup. Open its finder:</div><div class="lnkrow">'+linkBtn('Open board finder',res.link)+'</div></div>'; return; }
  var head='<div class="sec-h">'+arr.length+' school'+(arr.length===1?'':'s')+' · '+esc(res.matched||'')+(res.board?' · '+esc(res.board):'')+'</div>';
  $('fsOut').innerHTML=head+(arr.length?arr.map(function(s){
    var sub=[s.level||s.type,s.city,s.community,s.grades].filter(Boolean).join(' · ');
    return '<div class="card" style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><div style="min-width:0"><div class="card-t">'+esc(s.school)+'</div>'+(sub?'<div class="card-s">'+esc(sub)+'</div>':'')+'</div><div style="text-align:right;flex:none">'+(s.score?scoreBadge(s.score):'')+(s.rank?'<div style="font-size:11px;color:var(--mute);margin-top:4px">'+esc(s.rank)+'</div>':'')+'</div></div>';
  }).join(''):'<div class="empty">No schools returned.</div>');
}

function loadCrime(slug){
  if(slug) return loadCrimeDetail(slug);
  cachedCall('crimecities').then(function(d){
    var cities=(d&&(d.cities||d.rows))||[];
    var list=cities.map(function(c){return c.slug?c:{slug:String(c).toLowerCase(),name:c};});
    $('content').innerHTML='<div class="card"><div class="card-s">Pick a city to see its recorded crime figures.</div></div><div class="chips" id="crimechips"></div>';
    $('crimechips').innerHTML=list.map(function(c){return '<button class="citychip" data-s="'+esc(c.slug)+'">'+esc(c.name||c.slug)+'</button>';}).join('')||'<div class="empty">No cities.</div>';
    $('crimechips').querySelectorAll('.citychip').forEach(function(b){ b.addEventListener('click',function(){ go('crime', b.dataset.s); }); });
  }).catch(fail);
}
function loadCrimeDetail(slug){
  var label=String(slug).replace(/[-_]+/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();});
  $('scr-title').textContent=label;
  var back=backBtn('crime','All cities');
  call('crime',{slug:slug}).then(function(d){
    if(!d||d.ok===false){ $('content').innerHTML=back+'<div class="err">'+esc((d&&d.error)||'No data.')+'</div>'; return; }
    $('content').innerHTML=back+'<div class="sec-h">'+esc(label)+'</div>'+genCard(d.summary||d.totals||d);
  }).catch(fail);
}

function loadLTB(){
  $('content').innerHTML='<div class="fbar"><input id="ltbq" placeholder="Tenant name or property address…"><button class="gobtn" onclick="runLTB()">Search</button></div><div id="ltbRes"></div>';
  $('ltbq').addEventListener('keydown',function(e){if(e.key==='Enter')runLTB();});
}
function runLTB(){
  var q=($('ltbq').value||'').trim(); if(q.length<2){ $('ltbRes').innerHTML='<div class="empty">Enter at least 2 characters.</div>'; return; }
  $('ltbRes').innerHTML='<div class="loading">Searching…</div>';
  call('ltb',{q:q}).then(function(d){
    if(!d||d.ok===false){ $('ltbRes').innerHTML='<div class="err">'+esc((d&&d.error)||'No results.')+'</div>'; return; }
    var recs=d.records||[]; if(!recs.length){ $('ltbRes').innerHTML='<div class="empty">No orders found.</div>'; return; }
    $('ltbRes').innerHTML='<div class="sec-h">'+recs.length+' of '+(d.total||recs.length)+'</div>'+recs.map(function(r){
      return '<div class="card"><div class="card-t">'+esc(r.file||r.address||'Order')+'</div>'+kv('Type',r.typeLabel||r.appType)+kv('Date',r.date)+kv('Address',r.address)+kv('Landlord',r.landlord)+kv('Tenant',r.tenant)+'</div>';
    }).join('');
  }).catch(fail);
}

var BCC={pine:'c-pine',ochre:'c-ochre',grey:'c-grey',blue:'c-blue',rust:'c-rust'};
function runBC(){
  var v=($('bcaddr').value||'').trim(); if(v.length<4){ $('bcHint').textContent='Enter a full address including the city.'; return; }
  $('bcHint').textContent='Checking the municipal record…'; $('bcRes').innerHTML='';
  call('basement',{addr:v}).then(function(r){
    if(!r||!r.ok){ $('bcHint').textContent=(r&&r.error)||'Could not check that address.'; return; }
    $('bcHint').textContent='';
    var cls=BCC[r.colour]||'c-grey', nexts=(r.next||[]).map(function(x){return '<li>'+esc(x)+'</li>';}).join('');
    var ev=r.evidence||{}, rows=Object.keys(ev).map(function(k){return kv(k,ev[k]);}).join('');
    var sayPlain=String(r.say||'').replace(/<\/?em>/g,'');
    $('bcRes').innerHTML='<div class="card"><span class="stamp '+cls+'"><b>'+esc(r.statusLabel||'')+'</b></span><div class="card-t" style="margin-top:11px">'+esc(v)+'</div><p class="seclbl">Say this to your client</p><div class="say">'+(r.say||'')+'</div><button class="copy" id="bccp"><span>Copy wording</span></button>'+(nexts?'<p class="seclbl">Your next step</p><ul class="next">'+nexts+'</ul>':'')+(rows?'<details class="ev"><summary>Where this came from ›</summary>'+rows+'</details>':'')+'<div class="warn"><b>Never describe a unit as legal off this screen.</b> This reports a municipal record on the date shown — not a legal ruling.</div></div>';
    $('bccp').addEventListener('click',function(){ copyText(sayPlain); var s=this.querySelector('span'),o=s.textContent; s.textContent='Copied'; setTimeout(function(){s.textContent=o;},1400); });
  }).catch(fail);
}

function loadExpenses(){
  $('content').innerHTML='<div class="card"><div class="card-s">Rough monthly carrying-cost estimate. For a full breakdown use the website calculator.</div></div>'+field('Purchase price ($)','ex_price','850000')+field('Down payment (%)','ex_down','20')+field('Interest rate (%)','ex_rate','5.5')+field('Amortization (years)','ex_am','25')+field('Property tax / year ($)','ex_tax','4500')+field('Condo fees / month ($)','ex_condo','0')+'<button class="gobtn" style="width:100%;padding:13px;margin-top:6px" onclick="calcEx()">Calculate</button><div id="exOut" style="margin-top:14px"></div>';
}
function field(label,id,val){ return '<label class="seclbl" style="margin-top:12px;display:block">'+esc(label)+'</label><input id="'+id+'" inputmode="decimal" value="'+esc(val)+'" style="width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:8px">'; }
function num(id){ return parseFloat(($(id).value||'').replace(/[^0-9.]/g,''))||0; }
function calcEx(){
  var price=num('ex_price'),down=num('ex_down'),rate=num('ex_rate'),am=num('ex_am'),tax=num('ex_tax'),condo=num('ex_condo');
  var loan=price*(1-down/100), i=rate/100/12, n=am*12;
  var mort= i>0 ? loan*i/(1-Math.pow(1+i,-n)) : (n?loan/n:0);
  var total=mort+tax/12+condo;
  function money(x){return '$'+Math.round(x).toLocaleString();}
  $('exOut').innerHTML='<div class="card"><div class="card-t">'+money(total)+' / month</div>'+kv('Mortgage',money(mort))+kv('Property tax',money(tax/12))+kv('Condo fees',money(condo))+kv('Loan amount',money(loan))+'<div class="warn" style="background:var(--blue-soft);border-color:#cfe0ea;color:var(--blue)">Estimate only — excludes insurance, utilities, and closing costs.</div></div>';
}

  drawLB('month');

function drawLB(period){
  $('lbRes').innerHTML=skel(3);
  cachedCall('leaderboard',{period:period}).then(function(d){
    if(!d||d.ok===false){ $('lbRes').innerHTML='<div class="empty">'+esc((d&&d.error)||'No data.')+'</div>'; return; }
    var rows=d.agents||d.rows||d.leaders||[];
    if(!rows.length){ $('lbRes').innerHTML='<div class="empty">No data.</div>'; return; }
    function mins(s){ s=Number(s)||0; if(!s) return '0m'; var m=Math.round(s/60); return m>=60?(Math.floor(m/60)+'h '+(m%60)+'m'):(m+'m'); }
    var team=d.team||null;
    var head='<div class="card-s" style="margin:0 2px 10px">Ranked by talk time</div>';
    if(team){ head+='<div class="card" style="display:flex;gap:20px"><div><div class="card-s">Team calls</div><div class="card-t">'+esc(team.calls)+'</div></div><div><div class="card-s">Conversations</div><div class="card-t">'+esc(team.conv)+'</div></div><div><div class="card-s">Talk time</div><div class="card-t">'+mins(team.talkSec)+'</div></div></div>'; }
    $('lbRes').innerHTML=stamp(d)+head+rows.map(function(r,i){
      return '<div class="card"><div class="card-t">'+(i+1)+'. '+esc(r.name||r.agent||'—')+'</div><div style="font-family:var(--f-disp);font-weight:600;font-size:15px;color:var(--blue);margin:2px 0 4px">'+mins(r.talkSec)+' <span style="font-size:10.5px;color:var(--mute);font-weight:400;text-transform:uppercase;letter-spacing:.05em">talk time</span></div>'+kv('Calls',r.calls)+kv('Conversations',(r.conv!=null?r.conv:(r.conversations||0)))+'</div>';
    }).join('');
  }).catch(fail);
}

var TOKEN=null, WHO=null;
try{ TOKEN=localStorage.getItem('ak_token')||null; WHO=localStorage.getItem('ak_who')||null; }catch(e){}
function loginForm(target){
  return '<div class="login-card"><div class="card"><div class="card-t">Sign in</div><div class="card-s" style="margin-bottom:12px">Use your portal ID and password.</div><input id="lg_id" placeholder="ID" autocomplete="username"><input id="lg_pw" type="password" placeholder="Password" autocomplete="current-password"><button class="gobtn" style="width:100%;padding:12px" onclick="doLogin(\''+target+'\')">Sign in</button><div id="lg_err" class="err" style="padding:8px 0 0"></div></div></div>';
}
function doLogin(target){
  var id=($('lg_id').value||'').trim(), pw=($('lg_pw').value||'').trim();
  if(!id||!pw){ $('lg_err').textContent='Enter ID and password.'; return; }
  $('lg_err').textContent='Signing in…';
  call('login',{id:id,pw:pw,user:id,pass:pw}).then(function(r){
    if(!r||!r.ok||!r.token){ $('lg_err').textContent=(r&&r.error)||'Invalid ID or password.'; return; }
    TOKEN=r.token; WHO=r.name||id; try{localStorage.setItem('ak_token',TOKEN);localStorage.setItem('ak_who',WHO);}catch(e){}
    go(target);
  }).catch(function(){ $('lg_err').textContent='Sign-in failed — try again.'; });
}
function loadMyDeals(){
  if(!TOKEN){ $('content').innerHTML=loginForm('mydeals'); return; }
  call('mydeals',{auth:TOKEN}).then(function(d){
    if(!d||d.ok===false){ if(/login|token|auth/i.test((d&&d.error)||'')){ TOKEN=null; $('content').innerHTML=loginForm('mydeals'); return; } $('content').innerHTML='<div class="err">'+esc((d&&d.error)||'Could not load.')+'</div>'; return; }
    var deals=d.deals||d.rows||[], fu=d.followups||{current:[],future:[]};
    var current=fu.current||[], future=fu.future||[], nfu=current.length+future.length;
    var h='<div class="card"><div class="card-t">Hi '+esc(WHO||'')+'</div><div class="card-s">'+deals.length+' deals · '+nfu+' follow-ups</div><div class="lnkrow"><button class="lnk" onclick="signOut()">Sign out</button></div></div>';
    if(current.length){ h+='<div class="sec-h">Follow up now</div>'+current.slice(0,25).map(function(f){ return '<div class="card"><div class="card-t">'+esc(f.client||'—')+'</div>'+kv('Property',f.property)+kv('Closing',f.closing)+(f.days!=null?kv('Days',f.days):'')+kv('Last contact',f.lastContact)+'</div>'; }).join(''); }
    if(future.length){ h+='<div class="sec-h">Scheduled</div>'+future.slice(0,25).map(function(f){ return '<div class="card"><div class="card-t">'+esc(f.client||'—')+'</div>'+kv('Property',f.property)+kv('Next',f.nextTxt||f.nextISO)+'</div>'; }).join(''); }
    h+='<div class="sec-h">Deals</div>'+(deals.length?deals.map(function(x){ return '<div class="card"><div class="card-t">'+esc(x.property||x.client||'Deal')+'</div>'+kv('Status',x.status)+kv('Client',x.client)+kv('Closing',x.closing)+kv('Price',x.price)+kv('Commission',x.commission)+'</div>'; }).join(''):'<div class="empty">No deals yet.</div>');
    $('content').innerHTML=h;
  }).catch(fail);

function drawWeek(w){
  $('wkRes').innerHTML=skel(3);
  call('bootcamp',{auth:TOKEN,week:w}).then(function(d){
    if(!d||d.ok===false){ if(/login|token|auth/i.test((d&&d.error)||'')){ TOKEN=null; $('content').innerHTML=loginForm('onboarding'); return; } $('wkRes').innerHTML='<div class="empty">'+esc((d&&d.error)||'No content.')+'</div>'; return; }
    var plan=d.plan||{}, days=plan.days||[];
    if(!days.length){ $('wkRes').innerHTML='<div class="empty">'+esc(plan.empty?'No content for this week yet.':'No content for this week.')+'</div>'; return; }
    $('wkRes').innerHTML=days.map(function(day){
      var tasks=(day.tasks||[]).map(function(t){
        return '<div class="kv" style="align-items:flex-start"><span class="vv">'+(t.goal?'<b style="color:var(--ochre)">Goal: </b>':'')+esc(t.title||'')+(t.url?' '+linkBtn('Open',t.url):'')+'</span></div>';
      }).join('');
      return '<div class="card"><div class="card-t">'+esc(day.title||('Day '+(day.n||'')))+'</div>'+(day.goal?'<div class="card-s">'+esc(day.goal)+'</div>':'')+tasks+'</div>';
    }).join('');
  }).catch(fail);
}
function signOut(){ TOKEN=null;WHO=null; try{localStorage.removeItem('ak_token');localStorage.removeItem('ak_who');}catch(e){} go('mydeals'); }

function copyText(t){ try{ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t);return;} }catch(e){} var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta); }
function installHtml(){
  try{ var st=window.navigator.standalone||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches); if(st) return ''; if(localStorage.getItem('ak_install')==='1') return ''; }catch(e){}
  var ua=navigator.userAgent||'', tip=/iPhone|iPad|iPod/i.test(ua)?'Tap Share, then “Add to Home Screen”.':(/Android/i.test(ua)?'Tap the ⋮ menu, then “Add to Home screen” — it opens in your browser.':'Open on your phone to add it to your home screen.');
  return '<div class="install" id="inst"><button class="x" onclick="dismissInstall()">&times;</button><b>Add to your home screen.</b> '+tip+'</div>';
}
function dismissInstall(){ try{localStorage.setItem('ak_install','1');}catch(e){} var el=$('inst'); if(el)el.style.display='none'; }

/* back-to-top: appears past ~30% of the page (capped at 1500px so very long
   lists don't hide it), one shared component for every screen */
(function(){
  var btn=$('toTop');
  function update(){
    var scrollable=document.documentElement.scrollHeight-window.innerHeight;
    var threshold=Math.max(300, Math.min(scrollable*0.3, 1500));
    btn.classList.toggle('show', scrollable>600 && window.scrollY>threshold);
  }
  window.addEventListener('scroll', update, {passive:true});
  window.addEventListener('resize', update);
  btn.addEventListener('click', function(){
    window.scrollTo({top:0, behavior:(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)?'auto':'smooth'});
  });
})();
buildNav();
buildTabs();
if('scrollRestoration' in history) history.scrollRestoration='manual';   // router owns scroll position
window.addEventListener('hashchange', route);
route();
