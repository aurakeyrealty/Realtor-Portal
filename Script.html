function $(id){return document.getElementById(id);}
/* A gated action refusing the token ('login required' / expired / revoked) means
   the session is gone. Detect it in one place so every screen re-gates the way My
   Deals and Bootcamp already do — not an "admin only" authorization refusal, which
   is a valid session lacking a role and must NOT sign the user out. */
function isAuthErr(d){ return !!(d&&d.ok===false&&/\b(login|token|auth)\b/i.test(String(d.error||''))); }
/* Every server action requires a token except login/session. Attach it here so
   no call site can forget it — login ignores the field, session sets its own. */
function call(action,params){
  var p=params||{};
  if(action!=='login'&&TOKEN&&p.auth==null){ var q={}; for(var k in p) q[k]=p[k]; q.auth=TOKEN; p=q; }
  function onData(d){ if(action!=='login'&&isAuthErr(d)) sessionLost(); return d; }   // central re-gate
  if(window.AK_EXEC) return callHttp(action,p).then(onData);
  return new Promise(function(res,rej){
    google.script.run.withSuccessHandler(function(d){ res(onData(d)); }).withFailureHandler(rej).app(action,p);
  });
}
/* The same app() dispatcher over HTTP, for the installed app. Everything is a POST
   with a text/plain body: that is a CORS "simple request", so there is no preflight
   (Apps Script cannot answer one), and neither the password nor the session token
   ever rides a query string into the execution log.

   fetch resolves on far more than google.script.run does, and the cache layer
   below treats a rejection as "offline" and a resolution as data worth keeping.
   So anything that is not a JSON reply from our server -- an HTTP error, the HTML
   sign-in page Google serves when a deployment is re-scoped, a body that will not
   parse -- is rejected here, and the offline path stays the offline path. */
function callHttp(action,p){
  var body={}; for(var k in p) body[k]=p[k]; body.action=action;
  /* A request that never settles is the one failure the cache cannot help with: the
     saved copy is only read on rejection, so a stalled socket (a phone waking from
     the background onto a dead connection) would hold a full cache behind skeletons
     for as long as the OS lets it hang. Cut it off and let the offline path run. */
  var ac=(typeof AbortController!=='undefined')?new AbortController():null;
  var timer=ac?setTimeout(function(){ ac.abort(); },15000):null;
  function settle(){ if(timer) clearTimeout(timer); }
  return fetch(window.AK_EXEC,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow',signal:ac?ac.signal:undefined})
    .then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      if(!/json/i.test(r.headers.get('content-type')||'')) throw new Error('not JSON');
      return r.json();
    })
    .then(function(d){ settle(); return d; }, function(e){ settle(); throw (e&&e.name==='AbortError')?new Error('timed out'):e; });
}
/* read-through cache: instant back-navigation, offline fallback, manual refresh */
var MEM={}, FRESH=false, RENDER_FRESH=false, CACHE_TTL=600000, RENDER_SEQ=0;
var STALE_ERR={stale:true};
function freshOnly(pr){ var seq=RENDER_SEQ; return pr.then(function(d){ if(seq!==RENDER_SEQ) throw STALE_ERR; return d; }); }
function ckey(a,p){ return a+':'+JSON.stringify(p||{}); }
/* shallow copy so the offline flag never sticks to the cached object */
function offlineCopy(d,at){ var c={}; for(var ck in d) c[ck]=d[ck]; c.__offline=at; return c; }
function cachedCall(action,params){ return freshOnly(cachedCallRaw(action,params)); }
function cachedCallRaw(action,params){
  var k=ckey(action,params), fresh=RENDER_FRESH;
  if(!fresh){
    var m=MEM[k];
    if(m && Date.now()-m.at<CACHE_TTL) return Promise.resolve(m.data);
  }
  var p=params||{};
  if(fresh){ p={}; for(var kk in params) p[kk]=params[kk]; p.fresh=1; }
  return call(action,p).then(function(d){
    if(isAuthErr(d)) return d;   // never cache a 'login required' refusal
    MEM[k]={data:d,at:Date.now()};
    try{ var sj=JSON.stringify({data:d,at:Date.now()}); if(sj.length<200000) localStorage.setItem('akc_'+k,sj); }catch(e){}
    return d;
  }).catch(function(err){
    var m2=MEM[k]; if(m2) return offlineCopy(m2.data,m2.at);
    try{ var raw=localStorage.getItem('akc_'+k); if(raw){ var o=JSON.parse(raw); return offlineCopy(o.data,o.at); } }catch(e2){}
    throw err;
  });
}
function refreshView(){ FRESH=true; route(); }
function ago(t){ var ms=Date.now()-(typeof t==='number'?t:new Date(t).getTime()); if(isNaN(ms)||ms<0||ms>2592000000) return ''; var m=Math.round(ms/60000); if(m<1) return 'just now'; if(m<60) return m+'m ago'; var h=Math.round(m/60); return h<24?h+'h ago':Math.round(h/24)+'d ago'; }
var STALE_MS=600000;   // under 10 min the data counts as fresh — no Refresh button
function stamp(d){
  if(!d) return '';
  var off=d.__offline?'<div class="warn" style="margin:0 0 12px">Offline — showing saved data from '+esc(ago(d.__offline)||'earlier')+'.</div>':'';
  if(!d.updated) return off;
  var ms=Date.now()-new Date(d.updated).getTime(), bogus=isNaN(ms)||ms<0||ms>2592000000;
  var a=bogus?'':ago(d.updated);
  var showBtn=bogus||ms>=STALE_MS;
  var up='<div class="card-s" style="margin:0 2px 12px">'+(a?'Updated '+esc(a):'')
    +(showBtn?((a?' · ':'')+'<button class="linklike" onclick="refreshView()">Refresh</button>'):'')+'</div>';
  return off+up;
}
function isUrl(v){return /^https?:\/\//i.test(String(v||''));}
function host(u){try{return String(u).replace(/^https?:\/\//,'').replace(/^www\./,'').split('/')[0];}catch(e){return u;}}
/* website-parity helpers */
function money(v){ var s=String(v==null?'':v).trim(); if(!s) return ''; var n=s.replace(/[^0-9.]/g,''); if(!n) return s; var f=parseFloat(n); return isNaN(f)?s:'$'+f.toLocaleString('en-US',{maximumFractionDigits:0}); }
function pick(o,names){ if(!o) return ''; for(var i=0;i<names.length;i++){ for(var k in o){ if(k.toLowerCase()===names[i].toLowerCase() && o[k]!=null && o[k]!=='') return o[k]; } } return ''; }
function scoreNum(s){ var f=parseFloat(s); return isNaN(f)?-1:f; }
function scoreTier(s){ var f=scoreNum(s); if(f>=7.6)return'high'; if(f>=6)return'good'; if(f>=4.1)return'fair'; if(f>=0)return'low'; return''; }
function scoreBand(f){ if(f>=7.6)return'High'; if(f>=6)return'Good'; if(f>=4.1)return'Fair'; if(f>=0)return'Low'; return''; }
function scoreBadge(s){ var t=scoreTier(s),bd=scoreBand(scoreNum(s)); return '<span class="sb'+(t?' '+t:'')+'"><b>'+esc(s||'—')+'</b>'+(bd?'<i>'+bd+'</i>':'')+'</span>'; }
function listTone(l){ if(l.exclusive) return ['var(--ochre-soft)','var(--ochre)']; var s=((l.status||'')+' '+(l.section||'')).toLowerCase(); if(s.indexOf('lease')>=0)return['var(--slate-soft)','var(--slate)']; if(s.indexOf('commercial')>=0)return['var(--blue-soft)','var(--blue)']; if(s.indexOf('sold')>=0)return['var(--rust-soft)','var(--rust)']; return['var(--pine-soft)','var(--pine)']; }
/* skip bracketed nicknames and punctuation — "Pushpinder (Sid)" is P, not "P(" */
function initials(n){
  var p=String(n||'').split(/\s+/).map(function(w){ return w.replace(/[^A-Za-z]/g,''); }).filter(Boolean);
  if(!p.length) return '?';
  return (p[0].charAt(0)+(p[1]?p[1].charAt(0):'')).toUpperCase();
}

var TABS=[{v:'home',t:'Home'},{v:'cities',t:'Cities'},{v:'mydeals',t:'My Deals'},{v:'resources',t:'Resources'}];

  }).join('')
  +'<button id="tabMore"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg><span>More</span></button>';
  $('tabbar').querySelectorAll('button[data-v]').forEach(function(b){ b.addEventListener('click',function(){ go(b.dataset.v); }); });
  document.getElementById('tabMore').addEventListener('click',openDrawer);

function skel(n){
  var one='<div class="skel"><div class="b" style="width:55%"></div><div class="b" style="width:82%;margin-top:10px"></div><div class="b" style="width:34%;margin-top:10px"></div></div>', h='';
  for(var i=0;i<(n||3);i++) h+=one; return h;
}
function buildNav(){
  $('navlist').innerHTML=NAV.map(function(n){

var LOAD={home:loadHome,cities:loadCities,city:loadCityDetail,listings:loadListings,builders:loadBuilders,contractors:loadContractors,
  schools:loadSchools,findschool:loadFindSchool,crime:loadCrime,tenants:loadLTB,basement:loadBasement,expenses:loadExpenses,
  callnight:loadCallnight,leaderboard:loadLeaderboard,resources:loadResources,
  mydeals:loadMyDeals,onboarding:loadBootcamp,vacations:loadVacations,websites:loadWebsites,faqs:loadFaqs};
function go(v,arg){
  closeDrawer();
  var h='#'+v+(arg!=null?'/'+encodeURIComponent(arg):'');
  if(location.hash===h){ route(); } else { try{ location.hash=h; }catch(e){ route(); } }
}
var SCROLLPOS={};
function route(){
  if(!TOKEN){ showGate(); return; }      // hash changes must not slip past the gate
  closeDrawer();
  RENDER_SEQ++;
  RENDER_FRESH=FRESH; FRESH=false;
  var h=(location.hash||'').replace(/^#/,''), parts=h.split('/');
  var v=parts[0]||'home', arg=parts.length>1?decodeURIComponent(parts.slice(1).join('/')):null;
  if(!LOAD[v]){ v='home'; arg=null; }
  var item=NAV.filter(function(n){return n.v===v;})[0];
  $('scr-title').textContent=item?item.t:(arg||v); $('scr-sub').textContent=item?(SUB[v]||''):'';
  var navKey=(v==='city')?'cities':v;
  DETAIL_PARENT=(v==='city'&&arg)?'cities':((v==='crime'&&arg)?'crime':null);
  document.body.classList.toggle('detail', !!DETAIL_PARENT);
  $('navlist').querySelectorAll('.dr-item').forEach(function(b){ b.classList.toggle('on', b.dataset.v===navKey); });
  $('tabbar').querySelectorAll('button[data-v]').forEach(function(b){ b.classList.toggle('on', b.dataset.v===navKey); });
  $('content').innerHTML=skel(4);
  var want=SCROLLPOS[location.hash]||0;
  window.scrollTo(0,0);
  (LOAD[v]||function(){$('content').innerHTML='<div class="empty">Coming soon.</div>';})(arg);
  RENDER_FRESH=false;                 // the render's fetches are issued; later in-screen calls use the cache
  restoreScroll(want);
  paintEventBar();
}

/* ---- next-event banner: sits above the content on every screen, not just
   Home, so the team sees it wherever they are ---- */
var EVENT_DISMISSED=null;
try{ EVENT_DISMISSED=localStorage.getItem('ak_ev_seen'); }catch(e){}
function eventKey(ev){ return String(ev.iso||ev.date||'')+'|'+String(ev.title||''); }
function paintEventBar(){
  var bar=$('evbar'); if(!bar) return;
  var ev=(HOME&&HOME.events&&HOME.events.length)?HOME.events[0]:null;
  if(!ev){ bar.hidden=true; bar.innerHTML=''; if(!HOME) primeEventBar(); return; }
  // (HOME is populated by loadHome on the home route; primeEventBar covers the rest)
  if(eventKey(ev)===EVENT_DISMISSED){ bar.hidden=true; bar.innerHTML=''; return; }
  var when=[ev.date,ev.time].filter(Boolean).join(' · ');
  var line=[ev.location,ev.details].filter(Boolean).join(' · ');
  bar.innerHTML='<span class="ev-dot" aria-hidden="true"></span>'
    +'<div class="ev-tx"><b>Next event'+(when?' · '+esc(when):'')+'</b>'+(ev.title?'<span>'+esc(ev.title)+'</span>':'')+(line?'<i>'+esc(line)+'</i>':'')+'</div>'
    +'<span class="ev-act">'
      +(safeUrl(ev.link)?'<a class="ev-go" href="'+esc(safeUrl(ev.link))+'" target="_blank" rel="noopener">Register</a>':'')
      +'<button class="ev-x" id="evX" aria-label="Dismiss">'+ico('x',15)+'</button>'
    +'</span>';
  bar.hidden=false;
  $('evX').addEventListener('click',function(){
    EVENT_DISMISSED=eventKey(ev);
    try{ localStorage.setItem('ak_ev_seen',EVENT_DISMISSED); }catch(e){}
    bar.hidden=true; bar.innerHTML='';
  });
}
/* a cold start can land on any screen, so fetch home once for the event —
   but not on the home route itself, where loadHome is already fetching it
   and cachedCall has no in-flight dedupe */
var evPrimed=false;
function primeEventBar(){
  if(evPrimed) return;
  if((location.hash||'#home').replace(/^#/,'').split('/')[0]==='home') return;
  evPrimed=true;
  cachedCallRaw('home').then(function(d){
    if(d&&!HOME) HOME=d;
    paintEventBar();
  }).catch(function(){ evPrimed=false; });   // let a later screen try again
}
/* wait for the restored screen to grow tall enough, then put the user back where they were */
function restoreScroll(y){
  if(!y) return;
  var tries=0;
  (function attempt(){
    if(document.documentElement.scrollHeight-window.innerHeight>=y||tries>10){ window.scrollTo(0,y); return; }
    tries++; setTimeout(attempt,50);
  })();
}
function fail(e){ if(e===STALE_ERR) return; $('content').innerHTML='<div class="err">Could not load — try again.<br><span style="color:var(--mute)">'+esc((e&&e.message)||e||'')+'</span></div>'; }

function kv(k,v){ if(v==null||v===''||typeof v==='object')return''; if(isUrl(v))return '<div class="kv"><span class="kk">'+esc(k)+'</span><a class="vv" href="'+esc(v)+'" target="_blank" rel="noopener noreferrer">'+esc(host(v))+'</a></div>'; return '<div class="kv"><span class="kk">'+esc(k)+'</span><span class="vv">'+esc(v)+'</span></div>'; }
/* a spreadsheet cell is untrusted input: esc() stops it breaking out of the
   attribute but leaves "javascript:..." intact, so only http(s) may become an
   href — the token in localStorage is the whole app's key now */
function safeUrl(u){ return isUrl(u)?String(u):''; }
function linkBtn(label,url){ var u=safeUrl(url); return u?'<a class="lnk" href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+esc(label)+'</a>':''; }
function telBtn(p){ p=String(p||'').trim(); return p?'<a class="lnk" href="tel:'+esc(p.replace(/[^0-9+]/g,''))+'">Call '+esc(p)+'</a>':''; }
/* a sheet cell can hold several addresses ("a@x.com, b@y.com"); a raw comma in
   a mailto is malformed, so link each address on its own */
function mailAddrs(e){ return String(e||'').split(/[,;]+/).map(function(s){return s.trim();}).filter(Boolean); }
function mailBtn(e){
  var a=mailAddrs(e); if(!a.length) return '';
  return a.map(function(addr,i){ return '<a class="lnk" href="mailto:'+esc(encodeURIComponent(addr).replace(/%40/g,'@'))+'">'+(a.length>1?'Email '+(i+1):'Email')+'</a>'; }).join('');
}

var homeCat=null, HOME=null;
function loadHome(){
  cachedCall('home').then(function(d){
    HOME=d||{}; paintEventBar(); var h=stamp(d); var inst=installHtml(); if(inst) h+=inst;
    var focus=HOME.focus||[], events=HOME.events||[], groups=homeGroups(HOME.contacts||[]);
    var jumps=[];
    if(focus.length) jumps.push({id:'sec-focus',ic:1,label:'Focus ('+focus.length+')'});
    if(events.length) jumps.push({id:'sec-events',label:'Upcoming ('+events.length+')'});
    if(groups.order.length) jumps.push({id:'sec-contacts',label:'Contacts ('+(HOME.contacts||[]).length+')'});
    if(jumps.length>1) h+='<div class="chips" style="margin-bottom:16px">'+jumps.map(function(j){ return '<button class="citychip" data-j="'+j.id+'">'+(j.ic?'<span style="color:var(--ochre)">'+ico('star',13)+'</span> ':'')+esc(j.label)+'</button>'; }).join('')+'</div>';
    if(focus.length){ h+='<div class="sec-h" id="sec-focus"><span style="color:var(--ochre)">'+ico('star',13)+'</span> Focus projects · '+focus.length+'</div>'; h+=focus.map(function(p){
      var meta=[p.builder,p.type,p.occupancy].filter(Boolean).join(' · ');
      return '<div class="card"><span class="pill focus">Focus</span><div class="card-t">'+esc(p.project||p.name||'Project')+'</div>'+(p.city?'<div class="card-s">'+esc(p.city)+(meta?' · '+esc(meta):'')+'</div>':(meta?'<div class="card-s">'+esc(meta)+'</div>':''))+'<div class="lnkrow">'+linkBtn('Builder',p.broker_url)+linkBtn('Drive',p.drive_url)+linkBtn('Website',p.website_url)+'</div></div>';
    }).join(''); }
    if(events.length){ h+='<div class="sec-h" id="sec-events">Upcoming</div>'; h+=events.map(function(ev){
      /* the server sends details/time/location/link — the old card read
         ev.detail (singular) and dropped the rest, so none of it ever showed */
      var when=[ev.date||ev.when,ev.time].filter(Boolean).join(' · ');
      var body=ev.details||ev.desc||ev.detail||ev.body||'';
      return '<div class="card"><div class="card-t">'+esc(ev.title||ev.name||ev.event||'Event')+'</div>'
        +(when?'<div class="card-s">'+esc(when)+'</div>':'')
        +(ev.location?kv('Where',ev.location):'')
        +(body?'<div style="font-size:var(--fs-md);color:var(--ink2);margin-top:8px">'+esc(body)+'</div>':'')
        +(ev.link?'<div class="lnkrow">'+linkBtn('Register',ev.link)+'</div>':'')
        +'</div>';
    }).join(''); }
    if(groups.order.length){
      h+='<div class="sec-h" id="sec-contacts">Contacts</div><div class="chips" id="homeCats"></div>'
        +'<div style="margin-top:12px">'+filterBar('contacts','Filter by name, company or note')+'</div>'
        +'<div id="homeContacts"></div>';
    }
    if(!h) h='<div class="empty">No home data yet.</div>';
    $('content').innerHTML=h;

/* Mortgage contacts follow the web version's priority rather than sheet order:
   bankers grouped by bank, ranked National Bank -> TD -> CIBC -> the rest
   alphabetically, with brokers last. Every other category keeps sheet order. */
var MTG_RANK=['1st','2nd','3rd','4th','5th'];
function mtgPref(label){
  var l=String(label||'').toLowerCase();
  if(l.indexOf('national')>=0) return 0;
  if(l.indexOf('td')>=0) return 1;
  if(l.indexOf('cibc')>=0) return 2;
  return 3;
}
function isMortgageCat(k){ return /mortgage/i.test(String(k||'')); }
function mortgagePanel(items){
  /* one bucket per contact — titles are free text, and "Private Bank Broker"
     matching both regexes would list the same person under two ranks */
  var bankers=[], brokers=[], rest=[];
  items.forEach(function(c){
    var t=c.title||'';
    if(/broker/i.test(t)) brokers.push(c);
    else if(/bank/i.test(t)) bankers.push(c);
    else rest.push(c);
  });
  if(!bankers.length&&!brokers.length) return items.map(contactCard).join('');
  var banks={}, order=[];
  bankers.forEach(function(c){
    var b=(c.company||'Other').trim()||'Other', lb=b.toLowerCase();
    if(!banks[lb]){ banks[lb]={label:b,items:[]}; order.push(lb); }
    banks[lb].items.push(c);
  });
  order.sort(function(a,b){ var d=mtgPref(a)-mtgPref(b); return d!==0?d:(a<b?-1:1); });
  var notes=[], seenNote={};
  items.forEach(function(c){ var n=(c.notes||'').trim(); if(n&&!seenNote[n]){ seenNote[n]=1; notes.push(n); } });
  var h='';
  if(notes.length) h+='<div class="card wide"><div class="card-s">'+esc(notes.join(' · '))+'</div></div>';
  order.forEach(function(lb,i){
    var bk=banks[lb];
    h+='<div class="sec-h mtg-h"><span class="mtg-rank">'+MTG_RANK[i]+'</span>'+esc(bk.label)+' <span class="mtg-n">'+bk.items.length+(bk.items.length===1?' banker':' bankers')+'</span></div>';
    h+=bk.items.map(contactCard).join('');
  });
  if(brokers.length){
    h+='<div class="sec-h mtg-h">Mortgage brokers <span class="mtg-n">'+brokers.length+(brokers.length===1?' broker':' brokers')+'</span></div>';
    h+=brokers.map(contactCard).join('');
  }
  if(rest.length){
    h+='<div class="sec-h mtg-h">Other</div>'+rest.map(contactCard).join('');
  }
  return h;
}
function paintHomeContacts(groups){
  var g=groups.g[homeCat]||{items:[],label:''};
  var q=pageQ('contacts');
  var items=g.items.filter(function(c){ return qHit(q,c,['name','company','title','tag','notes','address','direct','office','email']); });
  pageCount('contacts',items.length,g.items.length,'contact','contacts');
  $('homeContacts').innerHTML=(items.length?(isMortgageCat(g.label||homeCat)?mortgagePanel(items):items.map(contactCard).join('')):'')
    ||'<div class="empty">'+(q?'Nothing matches.':'No contacts in this group.')+'</div>';
}

/* ---- one filter bar, shared by every list page ----

        +'<div id="n_'+page+'" class="card-s" style="margin:0 2px 10px"></div>';

function wireFilter(page,paint){

}

function fieldLabel(k){ return String(k).replace(/[_-]+/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2').replace(/\s+/g,' ').trim().replace(/^./,function(c){return c.toUpperCase();}); }

function paintBoardLinks(boards,sf){
  var byUrl={}, byName={}, links=[];
  // "Peel" from the sheet and "Peel Region" from the board table are the same
  // place with different URLs — match on the region word, not the link
  function nameKey(s){ return String(s||'').toLowerCase().replace(/\b(region|district|county|board|of)\b/g,'').replace(/[^a-z]+/g,''); }
  function add(name,url){
    url=String(url||'').trim(); name=String(name||'').trim();
    if(!/^https?:\/\//i.test(url)||!name) return;
    var uk=url.toLowerCase(), nk=nameKey(name);
    if(byUrl[uk]||(nk&&byName[nk])) return;
    byUrl[uk]=1; if(nk) byName[nk]=1;
    links.push({name:name,url:url});
  }
  (sf&&sf.rows||[]).forEach(function(x){ add(x.region,x.url); });        // the sheet is admin-curated, so it wins
  (boards||[]).forEach(function(b){ add(b.name,b.locator||b.url); });   // locator was fetched and dropped before
  if(!links.length){ $('fsLinks').innerHTML=''; return; }
  $('fsLinks').innerHTML='<div class="sec-h">Official board finders</div>'

var CRIME_LIST=[], crimeAll=false, crimeQ='';
try{ crimeAll=localStorage.getItem('ak_crime_all')==='1'; }catch(e){}
function loadCrime(slug){
  if(slug) return loadCrimeDetail(slug);
  cachedCall('crimecities').then(function(d){
    var cities=(d&&(d.cities||d.rows))||[];
    CRIME_LIST=cities.map(function(c){return c.slug?c:{slug:String(c).toLowerCase(),name:c};});
    var onCount=CRIME_LIST.filter(crimeIsON).length;
    $('content').innerHTML=stamp(d)
      +'<div class="card wide"><div class="card-s">Pick a city to see its recorded crime figures.</div></div>'
      +'<div class="seg" id="crimeScope"><button class="'+(crimeAll?'':'on')+'" data-a="0">Ontario</button><button class="'+(crimeAll?'on':'')+'" data-a="1">All Canada</button></div>'
      +'<div class="fbar" style="margin-top:0.75rem"><input id="crimeq" type="search" placeholder="Filter cities…" autocomplete="off" value="'+esc(crimeQ)+'"></div>'
      +'<div id="crimeCount" class="card-s" style="margin:0 2px 10px"></div>'
      +'<div id="crimechips"></div>';
    $('crimeScope').querySelectorAll('button').forEach(function(b){ b.addEventListener('click',function(){
      var want=b.dataset.a==='1'; if(want===crimeAll) return;
      crimeAll=want; try{ localStorage.setItem('ak_crime_all',crimeAll?'1':'0'); }catch(e){}
      $('crimeScope').querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b);});
      paintCrimeCities();
    }); });
    $('crimeq').addEventListener('input',function(){ crimeQ=this.value; paintCrimeCities(); });
    paintCrimeCities();
    if(!onCount&&!crimeAll){ crimeAll=true; $('crimeScope').querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x.dataset.a==='1');}); paintCrimeCities(); }
  }).catch(fail);
}
function crimeIsON(c){ return String(c.province||'').toUpperCase()==='ON'; }
function paintCrimeCities(){
  var q=crimeQ.trim().toLowerCase();
  var list=CRIME_LIST.filter(function(c){
    if(!crimeAll&&!crimeIsON(c)) return false;
    return !q||String(c.name||c.slug||'').toLowerCase().indexOf(q)>=0;
  });
  $('crimeCount').textContent=list.length+(list.length===1?' city':' cities')+(crimeAll?' across Canada':' in Ontario')+(q?' matching “'+crimeQ.trim()+'”':'');
  $('crimechips').innerHTML=list.length
    ? '<div class="rowlist">'+list.map(function(c){ return '<button class="rowitem" data-s="'+esc(c.slug)+'">'+esc(c.name||c.slug)+'<span class="rmeta">'+(crimeAll&&c.province?esc(c.province)+' ':'')+ico('chev',14)+'</span></button>'; }).join('')+'</div>'
    : '<div class="empty">No cities match.</div>';
  $('crimechips').querySelectorAll('.rowitem').forEach(function(b){ b.addEventListener('click',function(){ go('crime', b.dataset.s); }); });
}
function fmtN(n){ n=Number(n)||0; return n.toLocaleString('en-US'); }
function loadCrimeDetail(slug){
  var label=String(slug).replace(/[-_]+/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();});
  $('scr-title').textContent=label;
  cachedCall('crime',{slug:slug}).then(function(d){
    if(!d||d.ok===false){ $('content').innerHTML='<div class="err">'+esc((d&&d.error)||'No data.')+'</div>'; return; }
    var c=d.city||{};
    if(!c.count){ $('content').innerHTML='<div class="sec-h">'+esc(label)+'</div>'+genCard(d.summary||d.totals||d); return; }
    var h=stamp(d);
    h+='<div class="card"><div class="card-t">'+esc(c.name||label)+(c.province?' · '+esc(c.province):'')+'</div><div class="card-s">'+fmtN(c.count)+' recorded incidents'+(c.year_min?' · '+esc(c.year_min)+'–'+esc(c.year_max):'')+'</div>'+kv('Violent',fmtN(c.violent_count))+'</div>';
    var wins=(d.win&&d.win.windows)||{};
    var order=[['24h','Last 24 hours'],['60d','Last 60 days'],['6m','Last 6 months'],['1y','Last year'],['2y','Last 2 years']];
    var wr=order.filter(function(o){return wins[o[0]];}).map(function(o){ var w=wins[o[0]]; return kv(o[1],fmtN(w.count)+(w.violent_count?' · '+fmtN(w.violent_count)+' violent':'')); }).join('');
    if(wr) h+='<div class="sec-h">Recent activity</div><div class="card">'+wr+'</div>';
    var bc=c.byCategory||{};
    var cats=Object.keys(bc).map(function(k){return {k:k,n:Number(bc[k])||0};}).filter(function(x){return x.n>0;}).sort(function(a,b){return b.n-a.n;});
    if(cats.length){
      var max=cats[0].n||1;
      h+='<div class="sec-h">By category · all years</div><div class="card">'+cats.map(function(x){
        return '<div style="padding:5px 0"><div style="display:flex;justify-content:space-between;gap:10px;font-size:var(--fs-md)"><span style="color:var(--ink2)">'+esc(fieldLabel(x.k))+'</span><span style="font-family:var(--f-mono);font-size:var(--fs-sm);color:var(--mute)">'+fmtN(x.n)+'</span></div><div style="height:5px;border-radius:3px;background:var(--line2);margin-top:4px"><div style="height:5px;border-radius:3px;background:var(--blue);width:'+Math.max(2,Math.round(x.n/max*100))+'%"></div></div></div>';
      }).join('')+'</div>';
    }
    var by=c.byYear||{};
    var yrs=Object.keys(by).sort().slice(-4).reverse();
    if(yrs.length) h+='<div class="sec-h">Recent years</div><div class="card">'+yrs.map(function(y){ return kv(y,fmtN((by[y]||{}).count)); }).join('')+'</div>';
    h+='<div class="warn">Source: crimemaps.ca aggregated records. Coverage varies by year and service — use as an indicator, not an official statistic.</div>';
    $('content').innerHTML=h;
  }).catch(fail);
}

const BY_NAME = MUNICIPALITIES.reduce((m, x) => { m[x.name] = x; return m; }, {});

 
const municipalityNames = () =>
  MUNICIPALITIES.filter((x) => !x.hidden).map((x) => x.name);



function municipalRate(name) {
  const m = BY_NAME[name];
  if (!m) return null;
  const region = UPPER_TIER[m.region] || UPPER_TIER.none;
  const summed = m.lowerTier + region.rate + EDUCATION_RATE;
  const usePublished = typeof m.total === "number";

  
  let confidence = m.confidence;
  if (!usePublished && region.confidence === "estimate") confidence = "estimate";

  return {
    rate: usePublished ? m.total : summed,
    lowerTier: m.lowerTier,
    upperTier: region.rate,
    education: EDUCATION_RATE,
    regionName: region.name,
    effectiveOnPrice: m.effectiveOnPrice,
    confidence,
    source: m.source,
    verifyAt: m.verifyAt,
    derived: !usePublished,
  };
}





 
const INSURABLE_CAP = 1500000;



const PREMIUM_TAX_RATE = { ON: 0.08, QC: 0.09, SK: 0.06, MB: 0.09 };



function minDownPayment(price) {
  if (!(price > 0)) return 0;
  if (price < 500000) return price * 0.05;
  if (price < INSURABLE_CAP) return 25000 + (price - 500000) * 0.1;
  return price * 0.2;
}



function insurancePremiumRate(ltv, amortYears) {
  if (ltv > 0.95) return null;
  let rate;
  if (ltv > 0.9) rate = 4.0;
  else if (ltv > 0.85) rate = 3.1;
  else if (ltv > 0.8) rate = 2.8;
  else return 0;
  if (amortYears > 25) rate += 0.2;  
  return rate;
}



function monthlyRate(annualPct) {
  return Math.pow(1 + annualPct / 100 / 2, 1 / 6) - 1;
}

 
function mortgagePayment(principal, i, n) {
  if (!(principal > 0) || !(n > 0)) return 0;
  if (i === 0) return principal / n;
  return (principal * i) / (1 - Math.pow(1 + i, -n));
}



function buildMortgage({
  price, downPayment, ratePct, amortYears,
  firstTimeBuyer = false, newBuild = false, province = "ON",
}) {
  const minDown = minDownPayment(price);
  const belowMinimum = downPayment < minDown - 0.5;
  const downPct = price > 0 ? (downPayment / price) * 100 : 0;

  const baseLoan = Math.max(0, price - downPayment);
  const ltv = price > 0 ? baseLoan / price : 0;

  const overCap = price >= INSURABLE_CAP;
  const conventional = downPct >= 20;
  const insured = !overCap && !conventional && !belowMinimum;

  const premRate = insured ? insurancePremiumRate(ltv, amortYears) || 0 : 0;
  const premium = (baseLoan * premRate) / 100;
  const premiumTax = premium * (PREMIUM_TAX_RATE[province] || 0);

  const totalLoan = baseLoan + premium;
  const i = monthlyRate(ratePct);
  const n = amortYears * 12;
  const payment = mortgagePayment(totalLoan, i, n);

  const firstInterest = totalLoan * i;
  const firstPrincipal = Math.max(0, payment - firstInterest);
  const totalInterest = payment * n - totalLoan;

  
  
  const longAmortBlocked =
    insured && amortYears > 25 && !firstTimeBuyer && !newBuild;

  return {
    minDown, belowMinimum, downPayment, downPct,
    baseLoan, ltv, insured, conventional, overCap,
    premiumRate: premRate, premium, premiumTax,
    totalLoan, monthlyRate: i, payment,
    firstInterest, firstPrincipal, totalInterest,
    longAmortBlocked,
  };
}

 
function amortizationSchedule({ principal, ratePct, amortYears, maxRows = 0 }) {
  const i = monthlyRate(ratePct);
  const n = amortYears * 12;
  const pay = mortgagePayment(principal, i, n);
  const rows = [];
  let bal = principal;
  const limit = maxRows > 0 ? Math.min(maxRows, n) : n;
  for (let k = 1; k <= limit; k++) {
    const interest = bal * i;
    const principalPart = pay - interest;
    bal = Math.max(0, bal - principalPart);
    rows.push({ month: k, payment: pay, interest, principal: principalPart, balance: bal });
  }
  return { payment: pay, rows };
}







function propertyTaxAnnual({
  mode = "price", price = 0, municipality = null,
  effectivePct = null, assessedValue = 0, ratePct = null, amount = 0,
}) {
  const info = municipality ? municipalRate(municipality) : null;

  if (mode === "amount") {
    return { annual: amount, basis: "Entered directly", info };
  }
  if (mode === "assessed") {
    const r = ratePct != null ? ratePct : info ? info.rate : 0;
    return {
      annual: (assessedValue * r) / 100,
      basis: `MPAC assessed value x ${r.toFixed(4)}%`,
      rateUsed: r, info,
    };
  }
  const e = effectivePct != null ? effectivePct : info ? info.effectiveOnPrice : 0;
  return {
    annual: (price * e) / 100,
    basis: `Purchase price x ${e}% (estimate — no MPAC assessment yet)`,
    rateUsed: e, info,
  };
}

function computeCarryingCost(input = {}) {
  const q = { ...DEFAULT_INPUT, ...input };

  const mortgage = buildMortgage({
    price: q.price, downPayment: q.downPayment, ratePct: q.ratePct,
    amortYears: q.amortYears, firstTimeBuyer: q.firstTimeBuyer,
    newBuild: q.newBuild, province: q.province,
  });

  const tax = propertyTaxAnnual({
    mode: q.taxMode, price: q.price, municipality: q.municipality,
    effectivePct: q.taxEffectivePct, assessedValue: q.assessedValue,
    ratePct: q.taxRatePct, amount: q.taxAmount,
  });

  const utilities =
    q.hydro + q.gas + q.water + q.internet + q.waterHeaterRental + q.hvacRental;
  const fees = q.potl + q.condoFee + q.alarm + q.lawnSnow;
  const reserve = (q.price * q.maintenanceReservePct) / 100 / 12;

  
  
  const lines = [
    { key: "mortgage",   label: "Mortgage",            monthly: mortgage.payment, colour: "#D4A82C" },
    { key: "tax",        label: "Property tax",        monthly: tax.annual / 12,  colour: "#6EA8DC" },
    { key: "insurance",  label: "Home insurance",      monthly: q.insurance,      colour: "#5CC0A0" },
    { key: "utilities",  label: "Utilities & rentals", monthly: utilities,        colour: "#A6B6C8" },
    { key: "fees",       label: "Fees",                monthly: fees,             colour: "#E39A5C" },
    { key: "reserve",    label: "Maintenance reserve", monthly: reserve,          colour: "#E9D08A" },
    { key: "other",      label: q.otherLabel || "Other", monthly: q.other,        colour: "#B79AD1" },
  ];

  const monthlyTotal = lines.reduce((a, b) => a + b.monthly, 0);

  const warnings = [];
  if (mortgage.belowMinimum)
    warnings.push(`Down payment is below the ${Math.round(mortgage.minDown).toLocaleString("en-CA")} legal minimum for this price.`);
  if (mortgage.overCap && !mortgage.conventional)
    warnings.push("At $1.5M or above, mortgage insurance is unavailable — 20% down is required.");
  if (mortgage.longAmortBlocked)
    warnings.push("A 30-year amortization on an insured mortgage needs first-time buyer status or a new build.");
  if (tax.info && tax.info.confidence === "estimate" && q.taxMode === "assessed")
    warnings.push(`The ${q.municipality} rate is unconfirmed. Verify it before showing this to a client.`);

  return {
    input: q,
    mortgage,
    tax,
    lines: lines.filter((l) => l.monthly > 0),
    allLines: lines,
    utilities, fees, reserve,
    monthlyTotal,
    annualTotal: monthlyTotal * 12,
    nonMortgageMonthly: monthlyTotal - mortgage.payment,
    nonMortgageShare: monthlyTotal > 0 ? (monthlyTotal - mortgage.payment) / monthlyTotal : 0,
    warnings,
  };
}

/* ===================== SESSION =====================
   Sign-in guards the whole app, not two pages inside it. Everything that knows
   *how* a session is stored lives in these four functions, so the native build
   can swap localStorage for Capacitor Preferences without touching the gate. */
var TOKEN=null, WHO=null;
var SESSION_MS=7*24*60*60*1000;      // must match SESSION_MS in Core.js
/* "Remember me" chooses which store the session lives in: localStorage survives a
   relaunch, sessionStorage dies with the app — the answer for a shared office iPad.
   The choice itself is remembered so a renewal keeps the store the sign-in picked.
   Reads look in both, and clearing wipes both, so a session can never be half-gone. */
function tokenStore(){ try{ return localStorage.getItem('ak_remember')==='0'?sessionStorage:localStorage; }catch(e){ return localStorage; } }
function tokenGet(){ try{ return sessionStorage.getItem('ak_token')||localStorage.getItem('ak_token')||null; }catch(e){ return null; } }
function whoGet(){ try{ return sessionStorage.getItem('ak_who')||localStorage.getItem('ak_who')||null; }catch(e){ return null; } }
function tokenSet(t,who,remember){
  try{
    if(remember!=null) localStorage.setItem('ak_remember',remember?'1':'0');
    var s=tokenStore();
    s.setItem('ak_token',t); if(who!=null) s.setItem('ak_who',who);
  }catch(e){}
}
function tokenClear(){ try{ [localStorage,sessionStorage].forEach(function(s){ s.removeItem('ak_token'); s.removeItem('ak_who'); }); }catch(e){} }

/* The token is "user|role|issued" base64url'd, plus the server's signature. We
   read only the timestamp, and only to skip a pointless round trip on a token
   that is already dead — the signature is the server's business, and it checks
   it on every call. Nothing here decides who you are. */
function tokenIssued(t){
  try{
    var b=String(t||'').split('.')[0].replace(/-/g,'+').replace(/_/g,'/');
    while(b.length%4) b+='=';
    var n=Number(atob(b).split('|')[2]);
    return isFinite(n)?n:0;
  }catch(e){ return 0; }
}
function tokenAlive(t){ var i=tokenIssued(t); return !!i && (Date.now()-i)<SESSION_MS; }

function showGate(msg){
  TOKEN=null;
  closeDrawer();
  clearTimeout(TOAST_T); var tw=$('toast'); if(tw){ tw.classList.remove('on'); tw.hidden=true; }
  /* Renders already in flight would otherwise land after the gate goes up and
     repaint the last screen behind it; the seq bump makes freshOnly drop them. */
  RENDER_SEQ++;
  /* route() calls this on every hashchange while signed out, so it has to be
     safe to repeat: only a gate that is actually opening may clear the form. */
  var opening=!document.body.classList.contains('gated');
  document.body.classList.add('gated');
  $('gate').hidden=false;
  if(msg!=null) $('gate_err').textContent=msg;
  if(!opening) return;                        // never wipe what is being typed
  if(msg==null) $('gate_err').textContent='';
  var pw=$('gate_pw'); if(pw){ pw.value=''; pw.type='password'; paintEye(false); }   // never reopen revealed
  try{ $('gate_id').focus(); }catch(e){}
}
function hideGate(){ document.body.classList.remove('gated'); $('gate').hidden=true; }

function doLogin(){
  var id=($('gate_id').value||'').trim(), pw=$('gate_pw').value||'';
  if(!id||!pw){ $('gate_err').textContent='Enter your ID and password.'; return; }
  var btn=$('gate_go');
  btn.disabled=true; btn.textContent='Signing in…'; $('gate_err').textContent='';
  call('login',{id:id,pw:pw,user:id,pass:pw}).then(function(r){
    btn.disabled=false; btn.textContent='Sign in';
    if(!r||!r.ok||!r.token){ $('gate_err').textContent=sentence(r&&r.error)||'Invalid ID or password.'; return; }
    var rem=$('gate_remember'); TOKEN=r.token; WHO=r.name||id; tokenSet(TOKEN,WHO,!rem||rem.checked);
    $('gate_pw').value='';
    hideGate(); paintNavUser(); route();
    /* only on a real sign-in — a renewed session on launch is not an event
       anyone needs told about */
    toast('Welcome, '+firstName(WHO));
  }).catch(function(){
    btn.disabled=false; btn.textContent='Sign in';
    $('gate_err').textContent='Could not reach the server — check your connection.';
  });
}
/* the server's errors are lowercase fragments ("invalid id or password"); this
   screen is the one place a realtor reads them raw */
function sentence(t){ t=String(t||'').trim(); return t?t.charAt(0).toUpperCase()+t.slice(1)+(/[.!?]$/.test(t)?'':'.'):''; }
function paintNavUser(){ var el=$('drUser'); if(el) el.textContent=WHO?('Signed in as '+WHO):''; }
/* Greet by first name — the sheet holds "Harvinder Babra", but nobody wants to
   be welcomed by their full legal name. */
function firstName(n){ return String(n||'').trim().split(/\s+/)[0]||''; }
var TOAST_T=null;
function toast(msg,ms){
  var el=$('toast'); if(!el) return;
  clearTimeout(TOAST_T);
  el.textContent=msg; el.hidden=false;
  /* Forcing layout between display:none and the class is what lets the
     transition run. rAF would do it too, but it does not fire in a backgrounded
     tab, and the toast would then never become visible at all. */
  void el.offsetHeight;
  el.classList.add('on');
  TOAST_T=setTimeout(function(){
    el.classList.remove('on');
    TOAST_T=setTimeout(function(){ el.hidden=true; }, 250);   // after the fade
  }, ms||3200);
}

/* ---- My Deals: filters over the deal list, plus the leads / meetings /
   tickets the server has always sent and the app never rendered ---- */
var MD=null, mdStatus='All', mdMonth='All', mdTab='deals';
var MD_MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function mdNorm(s){ return String(s||'').trim().toLowerCase(); }
function mdMonthOf(x){
  var iso=String(x.closingISO||''); var m=/^(\d{4})-(\d{2})/.exec(iso);
  if(m) return +m[2];
  var t=String(x.closing||''); var mm=/(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})/.exec(t);
  /* the leading number is only a month if it can be one — a DD/MM/YYYY cell
     would otherwise yield 15 and label the option MD_MONTHS[14], i.e. undefined */
  if(mm){ var n=+mm[1]; if(n>=1&&n<=12) return n; var n2=+mm[2]; if(n2>=1&&n2<=12) return n2; }
  for(var i=0;i<12;i++) if(new RegExp('\\b'+MD_MONTHS[i],'i').test(t)) return i+1;
  return 0;
}
function renderMyDeals(d){
  MD=d||{};
  var deals=MD.deals||MD.rows||[], fu=MD.followups||{current:[],future:[]};
  var nfu=(fu.current||[]).length+(fu.future||[]).length;
  var counts={deals:deals.length, followups:nfu, leads:(MD.leads||[]).length, meetings:(MD.meetings||[]).length, tickets:(MD.tickets||[]).length};
  var tabs=[['deals','Deals'],['followups','Follow-ups'],['leads','Leads'],['meetings','Meetings'],['tickets','Tickets']]
    .filter(function(t){ return t[0]==='deals'||t[0]==='followups'||counts[t[0]]; });
  if(!tabs.some(function(t){return t[0]===mdTab;})) mdTab='deals';
  mdFuShown={current:MD_FU_STEP,future:MD_FU_STEP};   // per payload, or the "N of M" hint never returns
  $('content').innerHTML=
     '<div class="card"><div class="card-t">Hi '+esc(WHO||'')+'</div><div class="card-s">'+counts.deals+' deals · '+nfu+' follow-ups</div></div>'
    +'<div class="chips" id="mdTabs" style="margin-bottom:12px">'+tabs.map(function(t){
        return '<button class="citychip'+(t[0]===mdTab?' on':'')+'" data-t="'+t[0]+'">'+t[1]+' ('+counts[t[0]]+')</button>';
      }).join('')+'</div>'
    +'<div id="mdBody" class="cardgrid"></div>';
  $('mdTabs').querySelectorAll('.citychip').forEach(function(b){ b.addEventListener('click',function(){
    mdTab=b.dataset.t;
    $('mdTabs').querySelectorAll('.citychip').forEach(function(x){x.classList.toggle('on',x===b);});
    paintMyDeals();
  }); });
  paintMyDeals();
}
function paintMyDeals(){
  if(mdTab==='deals') return paintMDDeals();
  if(mdTab==='followups') return paintMDFollowups();
  if(mdTab==='leads') return paintMDList(MD.leads||[],['date','realtor','client','stage','source','notes'],'client','No leads.');
  if(mdTab==='meetings') return paintMDMeetings();
  if(mdTab==='tickets') return paintMDList(MD.tickets||[],['document','status','raised','closed','notes','ticket_id'],'document','No tickets.');
}
function paintMDDeals(){
  var deals=MD.deals||MD.rows||[];
  var statuses=[]; var seen={};
  deals.forEach(function(x){ var s=String(x.status||'').trim(); if(s&&!seen[mdNorm(s)]){ seen[mdNorm(s)]=1; statuses.push(s); } });
  var months=[]; var seenM={};
  deals.forEach(function(x){ var m=mdMonthOf(x); if(m&&!seenM[m]){ seenM[m]=1; months.push(m); } });
  months.sort(function(a,b){return a-b;});
  if(statuses.indexOf(mdStatus)<0&&mdStatus!=='All') mdStatus='All';
  /* a month carried over from a previous payload can hide every deal, and when
     only one month is present there is no select on screen to clear it with */
  if(mdMonth!=='All'&&months.indexOf(+mdMonth)<0) mdMonth='All';
  $('mdBody').innerHTML=
     '<div class="fbar">'
    +'<select id="mdStatus" aria-label="Filter by status"><option value="All"'+(mdStatus==='All'?' selected':'')+'>All statuses</option>'
      +statuses.map(function(s){ return '<option value="'+esc(s)+'"'+(s===mdStatus?' selected':'')+'>'+esc(s)+'</option>'; }).join('')+'</select>'
    +(months.length>1?'<select id="mdMonth" aria-label="Filter by closing month"><option value="All"'+(mdMonth==='All'?' selected':'')+'>All months</option>'
      +months.map(function(m){ return '<option value="'+m+'"'+(String(m)===String(mdMonth)?' selected':'')+'>'+MD_MONTHS[m-1]+'</option>'; }).join('')+'</select>':'')
    +'</div>'
    +'<div id="mdCount" class="card-s" style="margin:0 2px 10px"></div><div id="mdRows" class="cardgrid"></div>';
  $('mdStatus').addEventListener('change',function(){ mdStatus=this.value; paintMDRows(); });
  if($('mdMonth')) $('mdMonth').addEventListener('change',function(){ mdMonth=this.value; paintMDRows(); });
  paintMDRows();
}
function paintMDRows(){
  var deals=MD.deals||MD.rows||[];
  var rows=deals.filter(function(x){
    if(mdStatus!=='All'&&mdNorm(x.status)!==mdNorm(mdStatus)) return false;
    if(mdMonth!=='All'&&String(mdMonthOf(x))!==String(mdMonth)) return false;
    return true;
  });
  $('mdCount').textContent=rows.length+(rows.length===1?' deal':' deals')+(rows.length!==deals.length?' of '+deals.length:'');
  $('mdRows').innerHTML=rows.length?rows.map(function(x){
    return '<div class="card"><div class="card-t">'+esc(x.property||x.client||'Deal')+'</div>'+kv('Status',x.status)+kv('Client',x.client)+kv('Closing',x.closing)+kv('Price',x.price)+kv('Commission',x.commission)+'</div>';
  }).join(''):'<div class="empty">No deals match these filters.</div>';
}
/* the old page sliced follow-ups at 25 with no sign anything was cut, while
   the header counted them all — show everything, behind a "show the rest" */
var MD_FU_STEP=25, mdFuShown={current:MD_FU_STEP,future:MD_FU_STEP};
function paintMDFollowups(){
  var fu=MD.followups||{current:[],future:[]};
  var blocks=[['current','Follow up now',function(f){ return kv('Property',f.property)+kv('Closing',f.closing)+(f.days!=null?kv('Days',f.days):'')+kv('Last contact',f.lastContact); }],
              ['future','Scheduled',function(f){ return kv('Property',f.property)+kv('Next',f.nextTxt||f.nextISO); }]];
  var h='';
  blocks.forEach(function(b){
    var list=fu[b[0]]||[]; if(!list.length) return;
    var shown=Math.min(mdFuShown[b[0]],list.length);
    h+='<div class="sec-h">'+b[1]+' <span class="mtg-n">'+(shown<list.length?shown+' of '+list.length:list.length)+'</span></div>';
    h+=list.slice(0,shown).map(function(f){ return '<div class="card"><div class="card-t">'+esc(f.client||'—')+'</div>'+b[2](f)+'</div>'; }).join('');
    if(shown<list.length) h+='<button class="gobtn wide-btn" data-more="'+b[0]+'">Show '+Math.min(MD_FU_STEP,list.length-shown)+' more</button>';
  });

function paintMDMeetings(){
  var rows=MD.meetings||[];
  if(!rows.length){ $('mdBody').innerHTML='<div class="empty">No meetings.</div>'; return; }
  function mtgTone(s){
    s=mdNorm(s);
    if(/cancel|no.?show/.test(s)) return 'rust';
    if(/upcoming|scheduled|pending/.test(s)) return 'ochre';
    if(/complete|held|done|attended/.test(s)) return 'pine';
    return '';
  }
  $('mdBody').innerHTML=rows.map(function(m){
    var st=String(m.status||m.outcome||'').trim();
    var cls=mtgTone(st);
    return '<div class="card"><div class="card-t">'+esc(m.lead||m.client||'Meeting')+'</div>'
      +(st?'<span class="pill '+cls+'">'+esc(st)+'</span>':'')
      +kv('Date',[m.date,m.time].filter(Boolean).join(' · '))+kv('Type',m.type)+kv('Outcome',m.outcome)+kv('Source',m.source)
      +(m.fub?'<div class="lnkrow">'+linkBtn('Open in FUB',m.fub)+'</div>':'')+'</div>';
  }).join('');
}
function paintMDList(rows,order,titleKey,empty){
  if(!rows.length){ $('mdBody').innerHTML='<div class="empty">'+esc(empty)+'</div>'; return; }
  $('mdBody').innerHTML=rows.map(function(r){
    var keys=order||Object.keys(r);
    /* whichever key supplies the heading must not repeat as a row beneath it */
    var usedKey=(titleKey&&r[titleKey])?titleKey:keys[0];
    var t=r[usedKey]||'—';
    return '<div class="card"><div class="card-t">'+esc(t)+'</div>'+keys.map(function(k){
      if(k===usedKey||k==='fub') return '';
      return kv(k.charAt(0).toUpperCase()+k.slice(1),r[k]);
    }).join('')+(r.fub?'<div class="lnkrow">'+linkBtn('Open in FUB',r.fub)+'</div>':'')+'</div>';
  }).join('');
}
function loadBootcamp(){
  if(!TOKEN){ showGate(); return; }
  $('content').innerHTML='<div class="seg" id="wkseg"></div><div id="wkRes">'+skel(3)+'</div>';
  $('wkseg').innerHTML=[0,1,2,3,4].map(function(w){return '<button class="'+(w===1?'on':'')+'" data-w="'+w+'">'+(w===0?'Onboard':'Wk '+w)+'</button>';}).join('');
  $('wkseg').querySelectorAll('button').forEach(function(b){ b.addEventListener('click',function(){ $('wkseg').querySelectorAll('button').forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); drawWeek(+b.dataset.w); }); });
  drawWeek(1);
}
function drawWeek(w){
  $('wkRes').innerHTML=skel(3);
  freshOnly(call('bootcamp',{auth:TOKEN,week:w})).then(function(d){
    if(!d||d.ok===false){ if(isAuthErr(d)){ sessionLost(); return; } $('wkRes').innerHTML='<div class="empty">'+esc((d&&d.error)||'No content.')+'</div>'; return; }
    var plan=d.plan||{}, days=plan.days||[];
    if(!days.length){ $('wkRes').innerHTML='<div class="empty">'+esc(plan.empty?'No content for this week yet.':'No content for this week.')+'</div>'; return; }
    $('wkRes').innerHTML=days.map(function(day){
      var tasks=(day.tasks||[]).map(function(t){
        return '<div class="kv" style="align-items:flex-start"><span class="vv">'+(t.goal?'<b style="color:var(--ochre)">Goal: </b>':'')+esc(t.title||'')+(t.url?' '+linkBtn('Open',t.url):'')+'</span></div>';
      }).join('');
      return '<div class="card"><div class="card-t">'+esc(day.title||('Day '+(day.n||'')))+'</div>'+(day.goal?'<div class="card-s">'+esc(day.goal)+'</div>':'')+tasks+'</div>';
    }).join('');
  }).catch(fail);
}
function signOut(){
  TOKEN=null; WHO=null; tokenClear(); paintNavUser();
  forgetData();
  $('content').innerHTML='';
  showGate();
}
/* Drop every cached payload with the session. Nothing personal is cached today (My
   Deals and Bootcamp bypass the cache), but an installed app's storage outlives a
   browser tab by months, and the next person to sign in on this phone must not
   see the last one's screens while offline. */
function forgetData(){
  MEM={};
  try{ Object.keys(localStorage).forEach(function(k){ if(k.indexOf('akc_')===0) localStorage.removeItem(k); }); }catch(e){}
}
/* the server refused a token we thought was good: expired, revoked, or the
   signing key changed under us */
function sessionLost(){
  tokenClear(); TOKEN=null; WHO=null; paintNavUser();
  forgetData(); $('content').innerHTML='';  // body.gated only hides the shell in CSS
  showGate('Your session expired — please sign in again.');
}

function copyText(t){ try{ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t);return;} }catch(e){} var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta); }
function installHtml(){
  try{ var st=window.navigator.standalone||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches); if(st) return ''; if(localStorage.getItem('ak_install')==='1') return ''; }catch(e){}
  var ua=navigator.userAgent||'', tip=/iPhone|iPad|iPod/i.test(ua)?'Tap Share, then “Add to Home Screen”.':(/Android/i.test(ua)?'Tap the ⋮ menu, then “Install app” or “Add to Home screen”.':'Open on your phone to add it to your home screen.');
  return '<div class="install" id="inst"><button class="x" onclick="dismissInstall()" aria-label="Dismiss">'+ico('x',15)+'</button><b>Add to your home screen.</b> '+tip+'</div>';
}
function dismissInstall(){ try{localStorage.setItem('ak_install','1');}catch(e){} var el=$('inst'); if(el)el.style.display='none'; }

/* back-to-top: appears past ~30% of the page (capped at 1500px so very long
   lists don't hide it), one shared component for every screen */
(function(){
  var btn=$('toTop');
  function update(){
    var scrollable=document.documentElement.scrollHeight-window.innerHeight;
    var threshold=Math.max(300, Math.min(scrollable*0.3, 1500));
    btn.classList.toggle('show', scrollable>600 && window.scrollY>threshold);
    SCROLLPOS[location.hash]=window.scrollY;
  }
  window.addEventListener('scroll', update, {passive:true});
  window.addEventListener('resize', update);
  btn.addEventListener('click', function(){
    window.scrollTo({top:0, behavior:(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)?'auto':'smooth'});
  });
})();
buildNav();
buildTabs();
var DETAIL_PARENT=null;
document.getElementById('tbBack').addEventListener('click',function(){ go(DETAIL_PARENT||'home'); });
if('scrollRestoration' in history) history.scrollRestoration='manual';   // router owns scroll position
window.addEventListener('hashchange', route);

/* ---- boot ----------------------------------------------------------------
   No token, or one already past its seven days: show the gate and never touch
   the network — signing in is the only thing that screen can do.

   With a live token, render immediately and verify behind it. Blocking on a
   round trip would put a spinner in front of an app built to work offline, and
   a token the server refuses is torn down a moment later anyway. */
/* Two eyes: open when the password is hidden (tap to reveal), struck through when
   it is showing. Drawn here rather than in the markup so both states stay together. */
var EYE={ show:'M1.5 12S5 5.5 12 5.5 22.5 12 22.5 12 19 18.5 12 18.5 1.5 12 1.5 12z|M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',
          hide:'M3 3l18 18|M10.6 6.1A7.9 7.9 0 0 1 12 6c7 0 10.5 6 10.5 6a17 17 0 0 1-3.4 3.9M6.2 8.2A17 17 0 0 0 1.5 12S5 18 12 18a9 9 0 0 0 3.4-.6' };
function paintEye(on){
  var b=$('gate_eye'); if(!b) return;
  b.innerHTML='<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'
    + EYE[on?'hide':'show'].split('|').map(function(d){ return '<path d="'+d+'"/>'; }).join('') + '</svg>';
  b.setAttribute('aria-label',on?'Hide password':'Show password');
  b.setAttribute('aria-pressed',on?'true':'false');
}
function toggleEye(){
  var pw=$('gate_pw'); if(!pw) return;
  var on=pw.type==='password';
  pw.type=on?'text':'password';
  paintEye(on);
  try{ pw.focus(); pw.setSelectionRange(pw.value.length,pw.value.length); }catch(e){}
}
function boot(){
  $('gateForm').addEventListener('submit',function(e){ e.preventDefault(); doLogin(); });
  paintEye(false);
  $('gate_eye').addEventListener('click',toggleEye);
  var rem=$('gate_remember'); try{ if(rem) rem.checked=localStorage.getItem('ak_remember')!=='0'; }catch(e){}
  var stored=tokenGet(); WHO=whoGet(); paintNavUser();
  if(!stored){ tokenClear(); showGate(); return; }

  if(tokenAlive(stored)){
    TOKEN=stored; hideGate(); route(); verifySession(stored);
    return;
  }
  /* The device clock puts this past the window — but a phone with a wrong clock
     must not lock anyone out, so the server gets the final say. Gate while we ask;
     offline there is no ruling to be had, and gated is the safe answer. */
  showGate();
  call('session',{auth:stored}).then(function(r){
    if(r&&r.ok&&r.token){ TOKEN=r.token; tokenSet(TOKEN,WHO); hideGate(); paintNavUser(); route(); return; }
    tokenClear();
  }).catch(function(){ showGate('You’re offline — sign in once you’re connected.'); });
}
/* Verified behind the render, not in front of it: blocking would put a spinner
   over an app built to work offline, and a refused token is torn down a moment
   later anyway. */
function verifySession(tok){
  call('session',{auth:tok}).then(function(r){
    if(r&&r.ok){
      if(r.token){ TOKEN=r.token; tokenSet(TOKEN,WHO); }   // sliding: the clock restarts
      return;
    }
    /* Only a refusal of the token itself ends the session. Any other non-ok reply
       means the server is unwell, not that the token is -- signing the whole team
       out over that would be the worse failure. */
    if(isAuthErr(r)) sessionLost();
  }).catch(function(){ /* offline — stay in; the cached screens still work */ });
}
boot();
</script>
