<style>
:root{
  --ink:#0E1A22; --ink2:#33474F; --mute:#5A6B74;
  --paper:#E9EDEE; --card:#FFF; --line:#D3DADD; --line2:#EAEEEF;
  --blue:#1F4E6B; --blue-soft:#E4EDF2;
  --pine:#0F6349; --ochre:#9A6104; --slate:#54646C; --rust:#8C3019;
  --rust-soft:#F6E3DE; --pine-soft:#E1EFE9; --ochre-soft:#F7EEDC; --slate-soft:#EEF0F3;
  --blue-line:#CFE0EA;
  --fs-xs:0.6875rem; --fs-sm:0.75rem; --fs-md:0.84375rem;      /* 11 / 12 / 13.5px at a 16px root */
  --fs-base:0.9375rem; --fs-lg:1rem; --fs-lg2:1.03125rem; --fs-xl:1.25rem;   /* 15 / 16 / 16.5 / 20px */
  --col:30rem;                 /* content column; widened on tablets */
  --f-disp:'Archivo','Helvetica Neue',Arial,sans-serif;
  --f-body:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:clip}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:var(--fs-base);line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit;font-size:max(16px,var(--fs-lg2))}   /* floor: iOS zooms on focus below 16px */
a{color:var(--blue)}
.phone{max-width:var(--col);margin:0 auto;background:var(--paper);min-height:100vh}
.topbar{background:var(--ink);color:#fff;position:sticky;top:0;z-index:20;padding:0.5rem 1rem;padding-top:calc(0.5rem + env(safe-area-inset-top))}
.hdr{background:var(--ink);color:#fff;padding:0.25rem 1rem 1rem}
.hdr-row{display:flex;align-items:center;gap:0.75rem}
.burger{background:none;border:0;padding:0.6875rem 0.75rem 0.5rem;margin:-0.5rem 0 -0.5rem -0.75rem;color:#fff;cursor:pointer}
.tbback{display:none;background:none;border:0;padding:0.6875rem 0.75rem 0.5rem;margin:-0.5rem 0 -0.5rem -0.75rem;color:#fff;cursor:pointer}
body.detail .burger{display:none}
body.detail .tbback{display:block}
.mark{width:1.75rem;height:1.75rem;border-radius:4px;background:var(--blue);display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:var(--fs-sm);color:#fff}
.hdr-name{font-family:var(--f-disp);font-weight:800;font-size:var(--fs-md)}
.hdr-crumb{font-family:var(--f-mono);font-size:var(--fs-xs);letter-spacing:.12em;color:#8CA5B0;text-transform:uppercase;margin-top:0.0625rem}
.hdr h1{font-family:var(--f-disp);font-weight:600;font-size:var(--fs-xl);margin:0;letter-spacing:-.02em}
.hdr p{margin:0.1875rem 0 0;font-size:var(--fs-sm);color:#9DB2BB}
.scrim{position:fixed;inset:0;background:rgba(6,14,18,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:82%;max-width:20.625rem;background:var(--card);transform:translateX(-102%);transition:transform .22s;z-index:31;overflow-y:auto;overscroll-behavior:contain;box-shadow:2px 0 18px rgba(0,0,0,.18)}
.drawer.on{transform:translateX(0)}
.dr-head{background:var(--ink);color:#fff;padding:1rem 1rem 0.9375rem;display:flex;align-items:center;gap:0.625rem}
.dr-grp{font-family:var(--f-mono);font-size:var(--fs-xs);letter-spacing:.13em;text-transform:uppercase;color:var(--mute);padding:1rem 1rem 0.5rem}
.dr-item{display:flex;align-items:center;gap:0.75rem;width:100%;background:none;border:0;text-align:left;padding:0.75rem 1rem;font-size:var(--fs-base);color:var(--ink);border-left:3px solid transparent}
.dr-item:active{background:var(--blue-soft)}
.dr-item.on{background:var(--blue-soft);border-left-color:var(--blue);color:var(--blue);font-weight:600}
.dr-item.sub{padding-left:2.5rem;font-size:var(--fs-md);color:var(--ink2)}
.dr-ic{width:1.125rem;height:1.125rem;flex:none;color:var(--mute)}
.dr-item.on .dr-ic{color:var(--blue)}
.dr-foot{padding:1rem 1rem 1.875rem;border-top:1px solid var(--line2);margin-top:0.5rem}
.dr-user{font-size:var(--fs-md);color:var(--ink2);margin-bottom:0.625rem}
.dr-out{background:none;border:1px solid var(--line);border-radius:8px;padding:0.5rem 0.875rem;font-size:var(--fs-md);color:var(--ink2)}
.dr-ver{margin-top:0.875rem;color:var(--mute);font-size:var(--fs-xs);font-family:var(--f-mono)}
.wrap{padding:1rem 1rem calc(4.875rem + env(safe-area-inset-bottom))}
/* next-event banner — above the content on every screen */
.evbar{display:flex;align-items:flex-start;gap:0.5rem;margin:0.75rem 1rem 0;padding:0.6875rem 0.75rem 0.6875rem 0.875rem;border-radius:10px;background:var(--blue);color:#fff}
.evbar[hidden]{display:none}
.ev-dot{width:0.5rem;height:0.5rem;margin-top:0.3125rem;border-radius:50%;background:var(--ochre-soft);flex:none;box-shadow:0 0 0 0 rgba(247,238,220,.6);animation:evpulse 1.9s infinite}
@keyframes evpulse{70%{box-shadow:0 0 0 0.5rem rgba(247,238,220,0)}100%{box-shadow:0 0 0 0 rgba(247,238,220,0)}}
.ev-tx{flex:1;min-width:0;font-size:var(--fs-md);line-height:1.4}
.ev-tx b{display:block;font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.05em;opacity:.8;font-weight:600}
.ev-tx span{display:block;font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ev-tx i{display:block;font-style:normal;font-size:var(--fs-sm);opacity:.85;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.ev-act{display:flex;align-items:center;gap:0.125rem;flex:none;margin-top:0.0625rem}
.ev-go{background:#fff;color:var(--blue);text-decoration:none;font-weight:600;font-size:var(--fs-sm);padding:0.375rem 0.6875rem;border-radius:6px;white-space:nowrap}
.ev-x{background:none;border:0;color:#fff;opacity:.7;display:grid;place-items:center;min-width:2rem;min-height:2rem}
.ev-x:active{opacity:1}
@media (prefers-reduced-motion:reduce){.ev-dot{animation:none}}
.loading{color:var(--mute);font-size:var(--fs-md);padding:1.5rem 0.25rem}
.err{color:var(--rust);font-size:var(--fs-md);padding:0.875rem 0.25rem}
.empty{color:var(--mute);font-size:var(--fs-md);padding:1.25rem 0.25rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem;margin-bottom:0.75rem}
.card-t{font-family:var(--f-disp);font-weight:600;font-size:var(--fs-lg2);color:var(--ink);margin:0 0 0.25rem}
.card-s{font-size:var(--fs-md);color:var(--mute)}
.ctag{display:inline-block;margin-top:0.375rem;padding:0.125rem 0.5rem;border-radius:3px;background:var(--ochre-soft);color:var(--ochre);font-size:var(--fs-xs);font-weight:600;line-height:1.5}
.kv{display:flex;gap:0.5rem;font-size:var(--fs-md);padding:0.25rem 0}
.kk{color:var(--mute);flex:none;min-width:5rem;font-size:var(--fs-md)}
.vv{color:var(--ink2);min-width:0;word-break:break-word}
.pill{display:inline-block;font-size:var(--fs-xs);font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:0.1875rem 0.5rem;border-radius:999px;background:var(--blue-soft);color:var(--blue);margin-bottom:0.375rem}
.pill.focus,.pill.ochre{background:var(--ochre-soft);color:var(--ochre)}
.pill.rust{background:var(--rust-soft);color:var(--rust)}
.pill.pine{background:var(--pine-soft);color:var(--pine)}
.lnkrow{display:flex;flex-wrap:wrap;gap:0.5rem;margin-top:0.5rem}
.lnk{display:inline-flex;align-items:center;gap:0.375rem;border:1px solid var(--line);border-radius:8px;padding:0.6875rem 0.875rem;font-size:var(--fs-md);font-weight:600;color:var(--blue);background:var(--card);text-decoration:none;min-height:2.75rem}
.lnk:active{background:var(--blue-soft)}
.sec-h{font-family:var(--f-disp);font-weight:600;font-size:var(--fs-md);color:var(--ink);margin:1.125rem 0.125rem 0.5625rem;text-transform:uppercase;letter-spacing:.04em;scroll-margin-top:4rem}
.sec-h:first-child{margin-top:0.125rem}
.mtg-h{display:flex;align-items:center;gap:0.5rem}
.mtg-rank{flex:none;background:var(--blue);color:#fff;font-family:var(--f-mono);font-size:var(--fs-xs);font-weight:600;letter-spacing:0;padding:0.125rem 0.375rem;border-radius:3px;text-transform:none}
.mtg-n{margin-left:auto;color:var(--mute);font-weight:400;font-size:var(--fs-xs);text-transform:none;letter-spacing:0}
.chips{display:flex;flex-wrap:wrap;gap:0.5rem}
.citychip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:0.75rem 1rem;font-size:var(--fs-md);font-weight:600;color:var(--ink);min-height:2.75rem}
.citychip:active{border-color:var(--blue);color:var(--blue)}
.rowlist{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:0.75rem}
.rowitem{display:flex;align-items:center;gap:0.75rem;width:100%;background:none;border:0;border-bottom:1px solid var(--line2);padding:0.8125rem 1rem;font-size:var(--fs-base);font-weight:600;color:var(--ink);text-align:left;cursor:pointer;min-height:3.25rem}
.rowitem:last-child{border-bottom:0}
a.rowitem{text-decoration:none;box-sizing:border-box}
.rowitem:active{background:var(--blue-soft)}
.rmeta{margin-left:auto;display:flex;align-items:center;gap:0.625rem;color:var(--mute);font-weight:400;font-size:var(--fs-md);flex:none}
.tagchip{display:inline-block;border:1px solid var(--line2);background:var(--paper);border-radius:999px;padding:0.375rem 0.75rem;font-size:var(--fs-md);color:var(--ink2)}
.sb{display:inline-flex;align-items:center;gap:0.375rem}
.sb b{font-family:var(--f-mono);font-size:var(--fs-md);font-weight:700;padding:0.1875rem 0.5rem;border-radius:8px;background:var(--line2);color:var(--mute)}
.sb.high b{background:var(--pine);color:#fff}
.sb.good b{background:var(--pine-soft);color:var(--pine)}
.sb.fair b{background:var(--ochre-soft);color:var(--ochre)}
.sb.low b{background:var(--rust-soft);color:var(--rust)}
.sb i{font-style:normal;font-size:var(--fs-xs);color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.fbar{display:flex;gap:0.5rem;margin-bottom:1rem}
.fbar input,.fbar select{flex:1;min-width:0;padding:0.75rem;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-family:inherit;font-size:max(16px,var(--fs-lg2))}
.fbar input:focus,.fbar select:focus{outline:2px solid var(--blue);outline-offset:-1px}
.gobtn{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:0 1rem;font-weight:600;font-size:var(--fs-base)}
.wide-btn{display:block;width:100%;padding:0.75rem;margin:0.25rem 0 0.75rem}
.seg{display:flex;gap:0.5rem;margin-bottom:1rem}
.seg button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:0.75rem 0.5rem;font-size:var(--fs-md);font-weight:600;color:var(--ink2);min-height:2.75rem}
.seg button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.stamp{display:inline-block;border:2px solid currentColor;border-radius:3px;padding:0.4375rem 0.8125rem 0.375rem;box-shadow:inset 0 0 0 1px currentColor;margin-bottom:0.125rem}
.stamp b{display:block;font-family:var(--f-disp);font-weight:800;font-size:var(--fs-base);letter-spacing:.09em;text-transform:uppercase;line-height:1}
.c-pine{color:var(--pine)} .c-ochre{color:var(--ochre)} .c-grey{color:var(--slate)} .c-blue{color:var(--blue)} .c-rust{color:var(--rust)}
.say{background:#FBFAF8;border:1px solid var(--line);border-left:3px solid var(--ink);border-radius:8px;padding:0.75rem 1rem;font-size:var(--fs-base);line-height:1.6;color:var(--ink);margin-top:0.5rem}
.say em{font-style:italic;color:var(--blue)}
.copy{margin-top:0.5rem;display:inline-flex;align-items:center;gap:0.375rem;background:var(--ink);color:#fff;border:0;border-radius:8px;padding:0.6875rem 1rem;font-size:var(--fs-md);font-weight:600}
.next{margin:0.5rem 0 0;padding:0;list-style:none}
.next li{position:relative;padding:0.4375rem 0 0.4375rem 1.125rem;font-size:var(--fs-md);color:var(--ink2);border-bottom:1px solid var(--line2)}
.next li:last-child{border-bottom:0}
.next li:before{content:"";position:absolute;left:0.125rem;top:0.875rem;width:0.375rem;height:0.375rem;border-radius:50%;background:var(--blue)}
/* ---- Home Expenses form ---- */
.exgrp{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0.25rem 1rem;margin-bottom:0.75rem}
.exrow{display:flex;align-items:center;gap:0.75rem;padding:0.6875rem 0;border-bottom:1px solid var(--line2)}
.exrow:last-child{border-bottom:0}
.exlbl{flex:1;min-width:0;font-size:var(--fs-md);color:var(--ink2)}
.exlbl i{font-style:normal;color:var(--mute);font-size:var(--fs-xs)}
.exrow input,.exrow select{flex:none;width:9.5rem;max-width:45%;padding:0.5rem 0.625rem;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-family:inherit;font-size:max(16px,var(--fs-base));text-align:right}
/* the municipality name picks the tax rate, so it must stay readable — give
   the selects their own full-width line instead of clipping to a side column */
.exrow.exwide{flex-wrap:wrap;gap:0.375rem}
.exrow.exwide select{text-align:left;width:100%;max-width:none;flex:1 0 100%}
.exrow input:focus,.exrow select:focus{outline:2px solid var(--blue);outline-offset:-1px}
.exchk{display:flex;align-items:center;gap:0.625rem;padding:0.6875rem 0;border-bottom:1px solid var(--line2);font-size:var(--fs-md);color:var(--ink2)}
.exchk:last-child{border-bottom:0}
.exchk input{width:1.125rem;height:1.125rem;flex:none;accent-color:var(--blue)}
.exmore{padding:0}
.exmore>summary{padding:0.9375rem 1rem;font-weight:600;font-size:var(--fs-md);color:var(--blue);cursor:pointer;list-style:none}
.exmore>summary::-webkit-details-marker{display:none}
.exmore>summary::after{content:'+';float:right;font-weight:400;color:var(--mute)}
.exmore[open]>summary::after{content:'\2212'}
.exmore>summary+.exgrp{border:0;border-top:1px solid var(--line2);border-radius:0;margin:0}
.extotal{font-family:var(--f-disp);font-weight:700;font-size:2rem;letter-spacing:-.02em;color:var(--ink);line-height:1.1}
.extotal span{font-family:var(--f-body);font-size:var(--fs-md);font-weight:400;color:var(--mute);letter-spacing:0}
.exline{display:flex;align-items:center;gap:0.625rem;padding:0.4375rem 0;font-size:var(--fs-md)}
.exdot{width:0.625rem;height:0.625rem;border-radius:2px;flex:none}
.exname{flex:1;min-width:0;color:var(--ink2)}
.exshare{color:var(--mute);font-family:var(--f-mono);font-size:var(--fs-xs);flex:none}
.examt{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;flex:none;min-width:4.5rem;text-align:right}
.seclbl{font-family:var(--f-mono);font-size:var(--fs-xs);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:1.25rem 0 0.5rem}
.ev{margin-top:1rem;border-top:1px solid var(--line)}
.ev summary{cursor:pointer;list-style:none;padding:0.75rem 0.125rem 0.25rem;font-size:var(--fs-sm);font-weight:600;color:var(--mute)}
.ev summary::-webkit-details-marker{display:none}
.warn{margin-top:0.875rem;background:var(--rust-soft);border:1px solid #e6c6bd;border-radius:8px;padding:0.6875rem 0.8125rem;font-size:var(--fs-sm);color:var(--rust);line-height:1.5}
.install{margin:0 0 1rem;background:var(--blue-soft);border:1px solid var(--blue-line);border-radius:12px;padding:0.75rem 2.5rem 0.75rem 1rem;font-size:var(--fs-sm);color:var(--blue);position:relative}
.install .x{position:absolute;top:0;right:0;width:2.75rem;height:2.75rem;border:0;background:none;color:var(--blue);font-size:var(--fs-lg);cursor:pointer}
.avatar{width:2.75rem;height:2.75rem;border-radius:50%;object-fit:cover;background:var(--line);flex:none}
.linklike{background:none;border:0;color:var(--blue);font:inherit;font-weight:600;padding:0;text-decoration:underline;cursor:pointer}
.tabbar{position:fixed;bottom:0;left:0;right:0;max-width:var(--col);margin:0 auto;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:25;padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:0.25rem;padding:0.5rem 0 0.5rem;font-size:var(--fs-xs);font-weight:600;color:var(--mute);min-height:3.25rem;cursor:pointer}
.tabbar button.on{color:var(--blue)}
.tabbar svg{width:1.375rem;height:1.375rem}
.toTop{position:fixed;bottom:calc(4.75rem + env(safe-area-inset-bottom));right:max(0.875rem,calc(50vw - var(--col)/2 + 0.875rem));width:2.875rem;height:2.875rem;border-radius:50%;border:0;background:var(--ink);color:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(6,14,18,.28);z-index:24;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .18s,transform .18s;cursor:pointer}
.toTop.show{opacity:1;pointer-events:auto;transform:none}
/* ---- Tablet (>=44em / 704px): use the width instead of floating a phone column.
       Wider content rail and card lists flow two-up; lists, forms, filter bars
       and section headers still span the full rail. ---- */
@media(min-width:44em){
  :root{--col:47.5rem}
  #content,#slist,#alOut,#homeContacts,#lbRes,#fsOut,#wkRes,#ltbRes,#cnRec,.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(19rem,1fr));column-gap:0.75rem;align-items:start}
  #content>*,#slist>*,#alOut>*,#homeContacts>*,#lbRes>*,#fsOut>*,#wkRes>*,#ltbRes>*,#cnRec>*,.cardgrid>*{grid-column:1/-1}
  #content>.card,#content>.skel,#slist>.card,#alOut>.card,#homeContacts>.card,#lbRes>.card,#lbRes>.skel,#fsOut>.card,#wkRes>.card,#wkRes>.skel,#ltbRes>.card,#cnRec>.card,.cardgrid>.card{grid-column:auto}
  #content>.card.wide{grid-column:1/-1}   /* intro and summary cards span the rail */
  #content>.exmore{grid-column:1/-1}      /* a form section, not a card in a list */
}
/* ---- Pointer, not width, decides the navigation affordance: touch keeps the
       tab bar at any size; a mouse gets the framed page and the drawer. ---- */
@media(min-width:56em) and (pointer:fine){
  .phone{margin:1.25rem auto;min-height:auto;border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
  .tabbar{display:none}
  .wrap{padding-bottom:2.5rem}
  .toTop{bottom:1.25rem}
}
@media(prefers-reduced-motion:reduce){.toTop{transition:none}}
.skel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem;margin-bottom:0.75rem}
.skel .b{height:0.75rem;border-radius:6px;background:var(--line2);position:relative;overflow:hidden}
.skel .b::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shimmer 1.2s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
@media(prefers-reduced-motion:reduce){.skel .b::after{animation:none}}

/* ---- sign-in gate -------------------------------------------------------
   Covers the whole app, not a page inside it: the shell is hidden outright so
   no header or nav flashes before the token is known. dvh (not vh) because the
   native shell has no browser chrome to subtract. */
body.gated{overflow:hidden}
body.gated .phone,body.gated .toTop,body.gated .drawer,body.gated .scrim{display:none}
.gate{position:fixed;inset:0;z-index:60;background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;min-height:100dvh;
  padding:calc(1.5rem + env(safe-area-inset-top)) 1.25rem calc(1.5rem + env(safe-area-inset-bottom))}
.gate[hidden]{display:none}                    /* beats display:flex */
.gate-card{width:100%;max-width:20rem}
.gate-mark{width:2.5rem;height:2.5rem;font-size:var(--fs-lg);margin:0 auto 1.125rem}
.gate-t{font-family:var(--f-disp);font-weight:800;font-size:var(--fs-xl);text-align:center;margin:0}
.gate-s{color:rgba(255,255,255,.6);font-size:var(--fs-md);text-align:center;margin:0.375rem 0 1.75rem}
.gate-l{display:block;font-family:var(--f-mono);font-size:var(--fs-xs);letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:0.375rem}
.gate-card input{width:100%;padding:0.8125rem;margin-bottom:1rem;border-radius:8px;
  border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#fff}
.gate-card input:focus-visible{outline:2px solid #7FB2D0;outline-offset:1px}
