<style>
:root{
  --ink:#0E1A22; --ink2:#33474F; --mute:#5A6B74;
  --paper:#E9EDEE; --card:#FFF; --line:#D3DADD; --line2:#EAEEEF;
  --blue:#1F4E6B; --blue-soft:#E4EDF2;
  --pine:#0F6349; --ochre:#9A6104; --slate:#54646C; --rust:#8C3019;
  --rust-soft:#F6E3DE; --pine-soft:#E1EFE9; --ochre-soft:#F7EEDC; --slate-soft:#EEF0F3;
  --blue-line:#CFE0EA;
  --col:30rem;                 /* content column; widened on tablets */
  --f-disp:'Archivo','Helvetica Neue',Arial,sans-serif;
  --f-body:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:clip}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit;font-size:16.5px}
a{color:var(--blue)}
.phone{max-width:var(--col);margin:0 auto;background:var(--paper);min-height:100vh}
.topbar{background:var(--ink);color:#fff;position:sticky;top:0;z-index:20;padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top))}
.hdr{background:var(--ink);color:#fff;padding:4px 16px 16px}
.hdr-row{display:flex;align-items:center;gap:12px}
.burger{background:none;border:0;padding:11px 12px 8px;margin:-8px 0 -8px -12px;color:#fff;cursor:pointer}
.tbback{display:none;background:none;border:0;padding:11px 12px 8px;margin:-8px 0 -8px -12px;color:#fff;cursor:pointer}
body.detail .burger{display:none}
body.detail .tbback{display:block}
.mark{width:28px;height:28px;border-radius:4px;background:var(--blue);display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:12px;color:#fff}
.hdr-name{font-family:var(--f-disp);font-weight:800;font-size:13.5px}
.hdr-crumb{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:#8CA5B0;text-transform:uppercase;margin-top:1px}
.hdr h1{font-family:var(--f-disp);font-weight:600;font-size:20px;margin:0;letter-spacing:-.02em}
.hdr p{margin:3px 0 0;font-size:12px;color:#9DB2BB}
.scrim{position:fixed;inset:0;background:rgba(6,14,18,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:82%;max-width:330px;background:var(--card);transform:translateX(-102%);transition:transform .22s;z-index:31;overflow-y:auto;overscroll-behavior:contain;box-shadow:2px 0 18px rgba(0,0,0,.18)}
.drawer.on{transform:translateX(0)}
.dr-head{background:var(--ink);color:#fff;padding:16px 16px 15px;display:flex;align-items:center;gap:10px}
.dr-grp{font-family:var(--f-mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute);padding:16px 16px 8px}
.dr-item{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;text-align:left;padding:12px 16px;font-size:15px;color:var(--ink);border-left:3px solid transparent}
.dr-item:active{background:var(--blue-soft)}
.dr-item.on{background:var(--blue-soft);border-left-color:var(--blue);color:var(--blue);font-weight:600}
.dr-item.sub{padding-left:40px;font-size:13.5px;color:var(--ink2)}
.dr-ic{width:18px;height:18px;flex:none;color:var(--mute)}
.dr-item.on .dr-ic{color:var(--blue)}
.wrap{padding:16px 16px calc(78px + env(safe-area-inset-bottom))}
.loading{color:var(--mute);font-size:13.5px;padding:24px 4px}
.err{color:var(--rust);font-size:13.5px;padding:14px 4px}
.empty{color:var(--mute);font-size:13.5px;padding:20px 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.card-t{font-family:var(--f-disp);font-weight:600;font-size:16.5px;color:var(--ink);margin:0 0 4px}
.card-s{font-size:13.5px;color:var(--mute)}
.kv{display:flex;gap:8px;font-size:13.5px;padding:4px 0}
.kk{color:var(--mute);flex:none;min-width:80px;font-size:13.5px}
.vv{color:var(--ink2);min-width:0;word-break:break-word}
.pill{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:3px 8px;border-radius:999px;background:var(--blue-soft);color:var(--blue);margin-bottom:6px}
.pill.focus{background:var(--ochre-soft);color:var(--ochre)}
.lnkrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.lnk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:11px 14px;font-size:13.5px;font-weight:600;color:var(--blue);background:var(--card);text-decoration:none;min-height:44px}
.lnk:active{background:var(--blue-soft)}
.sec-h{font-family:var(--f-disp);font-weight:600;font-size:13.5px;color:var(--ink);margin:18px 2px 9px;text-transform:uppercase;letter-spacing:.04em;scroll-margin-top:64px}
.sec-h:first-child{margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.citychip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:12px 16px;font-size:13.5px;font-weight:600;color:var(--ink);min-height:44px}
.citychip:active{border-color:var(--blue);color:var(--blue)}
.rowlist{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.rowitem{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line2);padding:13px 16px;font-size:15px;font-weight:600;color:var(--ink);text-align:left;cursor:pointer;min-height:52px}
.rowitem:last-child{border-bottom:0}
.rowitem:active{background:var(--blue-soft)}
.rmeta{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--mute);font-weight:400;font-size:13.5px;flex:none}
.tagchip{display:inline-block;border:1px solid var(--line2);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13.5px;color:var(--ink2)}
.sb{display:inline-flex;align-items:center;gap:6px}
.sb b{font-family:var(--f-mono);font-size:13.5px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--line2);color:var(--mute)}
.sb.high b{background:var(--pine);color:#fff}
.sb.good b{background:var(--pine-soft);color:var(--pine)}
.sb.fair b{background:var(--ochre-soft);color:var(--ochre)}
.sb.low b{background:var(--rust-soft);color:var(--rust)}
.sb i{font-style:normal;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.fbar{display:flex;gap:8px;margin-bottom:16px}
.fbar input{flex:1;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.fbar input:focus{outline:2px solid var(--blue);outline-offset:-1px}
.gobtn{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:0 16px;font-weight:600;font-size:15px}
.seg{display:flex;gap:8px;margin-bottom:16px}
.seg button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:12px 8px;font-size:13.5px;font-weight:600;color:var(--ink2);min-height:44px}
.seg button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.stamp{display:inline-block;border:2px solid currentColor;border-radius:3px;padding:7px 13px 6px;box-shadow:inset 0 0 0 1px currentColor;margin-bottom:2px}
.stamp b{display:block;font-family:var(--f-disp);font-weight:800;font-size:15px;letter-spacing:.09em;text-transform:uppercase;line-height:1}
.c-pine{color:var(--pine)} .c-ochre{color:var(--ochre)} .c-grey{color:var(--slate)} .c-blue{color:var(--blue)} .c-rust{color:var(--rust)}
.say{background:#FBFAF8;border:1px solid var(--line);border-left:3px solid var(--ink);border-radius:8px;padding:12px 16px;font-size:15px;line-height:1.6;color:var(--ink);margin-top:8px}
.say em{font-style:italic;color:var(--blue)}
.copy{margin-top:8px;display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;border:0;border-radius:8px;padding:11px 16px;font-size:13.5px;font-weight:600}
.next{margin:8px 0 0;padding:0;list-style:none}
.next li{position:relative;padding:7px 0 7px 18px;font-size:13.5px;color:var(--ink2);border-bottom:1px solid var(--line2)}
.next li:last-child{border-bottom:0}
.next li:before{content:"";position:absolute;left:2px;top:14px;width:6px;height:6px;border-radius:50%;background:var(--blue)}
.seclbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:20px 0 8px}
.ev{margin-top:16px;border-top:1px solid var(--line)}
.ev summary{cursor:pointer;list-style:none;padding:12px 2px 4px;font-size:12px;font-weight:600;color:var(--mute)}
.ev summary::-webkit-details-marker{display:none}
.warn{margin-top:14px;background:var(--rust-soft);border:1px solid #e6c6bd;border-radius:8px;padding:11px 13px;font-size:12px;color:var(--rust);line-height:1.5}
.install{margin:0 0 16px;background:var(--blue-soft);border:1px solid var(--blue-line);border-radius:12px;padding:12px 40px 12px 16px;font-size:12px;color:var(--blue);position:relative}
.install .x{position:absolute;top:0;right:0;width:44px;height:44px;border:0;background:none;color:var(--blue);font-size:16px;cursor:pointer}
.login-card{max-width:340px;margin:8px auto}
.login-card input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--line);flex:none}
.linklike{background:none;border:0;color:var(--blue);font:inherit;font-weight:600;padding:0;text-decoration:underline;cursor:pointer}
.tabbar{position:fixed;bottom:0;left:0;right:0;max-width:var(--col);margin:0 auto;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:25;padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 8px;font-size:11px;font-weight:600;color:var(--mute);min-height:52px;cursor:pointer}
.tabbar button.on{color:var(--blue)}
.tabbar svg{width:22px;height:22px}
.toTop{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));right:max(0.875rem,calc(50vw - var(--col)/2 + 0.875rem));width:46px;height:46px;border-radius:50%;border:0;background:var(--ink);color:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(6,14,18,.28);z-index:24;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .18s,transform .18s;cursor:pointer}
.toTop.show{opacity:1;pointer-events:auto;transform:none}
/* ---- Tablet (>=44em / 704px): use the width instead of floating a phone column.
       Wider content rail and card lists flow two-up; lists, forms, filter bars
       and section headers still span the full rail. ---- */
@media(min-width:44em){
  :root{--col:47.5rem}
  #content,#slist,#alOut,#homeContacts,#lbRes,#fsOut,#wkRes,#ltbRes{display:grid;grid-template-columns:repeat(auto-fill,minmax(19rem,1fr));gap:0.75rem;align-items:start}
  #content>*,#slist>*,#alOut>*,#homeContacts>*,#lbRes>*,#fsOut>*,#wkRes>*,#ltbRes>*{grid-column:1/-1}
  #content>.card,#content>.skel,#slist>.card,#alOut>.card,#homeContacts>.card,#lbRes>.card,#lbRes>.skel,#fsOut>.card,#wkRes>.card,#wkRes>.skel,#ltbRes>.card{grid-column:auto;margin-bottom:0}
  .login-card{grid-column:1/-1}
}
/* ---- Pointer, not width, decides the navigation affordance: touch keeps the
       tab bar at any size; a mouse gets the framed page and the drawer. ---- */
@media(min-width:56em) and (pointer:fine){
  .phone{margin:1.25rem auto;min-height:auto;border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
  .tabbar{display:none}
  .wrap{padding-bottom:2.5rem}
  .toTop{bottom:1.25rem}
}
@media(prefers-reduced-motion:reduce){.toTop{transition:none}}
.skel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.skel .b{height:12px;border-radius:6px;background:var(--line2);position:relative;overflow:hidden}
.skel .b::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shimmer 1.2s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
@media(prefers-reduced-motion:reduce){.skel .b::after{animation:none}}
</style>
